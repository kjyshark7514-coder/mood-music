<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - My Music</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }

    .page {
      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #dff4f6;
    }

    .logo {
      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;
      font-weight: 600;

      letter-spacing: 3px;
    }

    .playlist-title {
      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(30px, 8vw, 42px);

      line-height: 1.3;

      font-weight: 600;

      letter-spacing: -1.5px;
    }

    .playlist-subtitle {
      margin: 15px 0 0;

      text-align: center;

      color: #607781;

      font-size: 16px;

      line-height: 1.5;
    }

    .play-all-button {
      width: 100%;
      max-width: 420px;

      margin-top: 28px;

      padding: 16px 20px;

      border: none;
      border-radius: 18px;

      background: #10202a;
      color: #ffffff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.2s ease;
    }

    .play-all-button:active {
      transform: scale(0.97);
    }

    .now-playing {
      width: 100%;
      max-width: 420px;

      margin-top: 14px;

      padding: 13px 16px;

      border-radius: 15px;

      background:
        rgba(
          255,
          255,
          255,
          0.65
        );

      color: #526b74;

      text-align: center;

      font-size: 13px;

      line-height: 1.5;
    }

    .music-list {
      width: 100%;
      max-width: 420px;

      margin-top: 40px;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .music-item {
      width: 100%;

      padding: 20px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          0.82
        );

      box-shadow:
        0 8px 25px
        rgba(
          16,
          32,
          42,
          0.06
        );

      border:
        2px solid transparent;

      transition:
        border 0.2s ease,
        transform 0.2s ease;
    }

    .music-item.selected {
      border-color: #10202a;

      transform:
        translateY(-2px);
    }

    .music-info {
      width: 100%;

      margin-bottom: 16px;
    }

    .music-name {
      margin: 0;

      color: #10202a;

      font-size: 19px;
      font-weight: 600;

      line-height: 1.4;
    }

    .music-artist {
      margin: 6px 0 0;

      color: #607781;

      font-size: 14px;

      line-height: 1.4;
    }

    .music-actions {
      display: flex;

      gap: 10px;

      width: 100%;
    }

    .play-button {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 48px;

      padding: 12px;

      border-radius: 16px;

      background: #10202a;
      color: #ffffff;

      text-decoration: none;

      font-size: 14px;
      font-weight: 500;
    }

    .remove-button {
      width: 54px;
      min-width: 54px;
      min-height: 48px;

      border: none;
      border-radius: 16px;

      background: #edf7f8;
      color: #10202a;

      font-size: 22px;

      cursor: pointer;
    }

    .remove-button:active {
      transform: scale(0.88);
    }

    .empty-message {
      width: 100%;
      max-width: 420px;

      margin-top: 55px;

      padding: 40px 24px;

      border-radius: 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.7
        );

      text-align: center;

      color: #607781;

      font-size: 16px;

      line-height: 1.6;
    }

    .empty-heart {
      display: block;

      margin-bottom: 15px;

      font-size: 42px;
    }

    .back-button {
      margin-top: 30px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .logo {
        margin-bottom: 45px;
      }

      .music-item {
        padding: 18px;
      }

      .music-name {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
      SHARK
    </div>

    <h1 class="playlist-title">
      MY MUSIC
    </h1>

    <p class="playlist-subtitle">
      내가 좋아하는 노래만 모아봤어.
    </p>

    <button
      class="play-all-button"
      id="playAllButton"
      type="button"
    >
      ▶ 첫 곡부터 듣기
    </button>

    <div
      class="now-playing"
      id="nowPlaying"
      style="display: none;"
    ></div>

    <div
      class="music-list"
      id="musicList"
    ></div>

    <div
      class="empty-message"
      id="emptyMessage"
      style="display: none;"
    >
      <span class="empty-heart">
        🤍
      </span>

      아직 저장한 노래가 없어.<br>

      마음에 드는 노래에<br>
      ♥를 눌러 저장해봐.
    </div>

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 기분 고르기
    </button>

  </main>

  <script>
    let savedSongs = [];

    try {
      savedSongs =
        JSON.parse(
          localStorage.getItem(
            "sharkPlaylist"
          ) || "[]"
        );

      if (
        !Array.isArray(
          savedSongs
        )
      ) {
        savedSongs = [];
      }
    }
    catch (error) {
      savedSongs = [];
    }

    const musicList =
      document.getElementById(
        "musicList"
      );

    const emptyMessage =
      document.getElementById(
        "emptyMessage"
      );

    const playAllButton =
      document.getElementById(
        "playAllButton"
      );

    const nowPlaying =
      document.getElementById(
        "nowPlaying"
      );

    const backButton =
      document.getElementById(
        "backButton"
      );

    function getYouTubeMusicURL(
      song
    ) {
      const searchText =
        song.title +
        " " +
        song.artist;

      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(
          searchText
        )
      );
    }

    function getSongURL(
      song
    ) {
      if (
        song.url &&
        typeof song.url === "string"
      ) {
        return song.url;
      }

      return getYouTubeMusicURL(
        song
      );
    }

    function openMusic(
      song
    ) {
      if (!song) {
        return;
      }

      window.open(
        getSongURL(
          song
        ),
        "_blank",
        "noopener,noreferrer"
      );
    }

    function playFirstSong() {
      if (
        savedSongs.length === 0
      ) {
        return;
      }

      const firstSong =
        savedSongs[0];

      nowPlaying.style.display =
        "block";

      nowPlaying.textContent =
        "▶ " +
        firstSong.title +
        " — " +
        firstSong.artist +
        "부터 들어볼 수 있어.";

      openMusic(
        firstSong
      );

      highlightSong(
        0
      );
    }

    function highlightSong(
      index
    ) {
      const items =
        document.querySelectorAll(
          ".music-item"
        );

      items.forEach(
        function(
          item,
          itemIndex
        ) {
          item.classList.toggle(
            "selected",
            itemIndex === index
          );
        }
      );
    }

    function savePlaylist() {
      localStorage.setItem(
        "sharkPlaylist",
        JSON.stringify(
          savedSongs
        )
      );
    }

    function removeSong(
      index
    ) {
      savedSongs.splice(
        index,
        1
      );

      savePlaylist();

      nowPlaying.style.display =
        "none";

      renderPlaylist();
    }

    function renderPlaylist() {
      musicList.innerHTML =
        "";

      if (
        savedSongs.length === 0
      ) {
        musicList.style.display =
          "none";

        emptyMessage.style.display =
          "block";

        playAllButton.style.display =
          "none";

        nowPlaying.style.display =
          "none";

        return;
      }

      musicList.style.display =
        "flex";

      emptyMessage.style.display =
        "none";

      playAllButton.style.display =
        "block";

      savedSongs.forEach(
        function(
          song,
          index
        ) {
          const item =
            document.createElement(
              "article"
            );

          item.className =
            "music-item";

          const info =
            document.createElement(
              "div"
            );

          info.className =
            "music-info";

          const title =
            document.createElement(
              "h2"
            );

          title.className =
            "music-name";

          title.textContent =
            song.title;

          const artist =
            document.createElement(
              "p"
            );

          artist.className =
            "music-artist";

          artist.textContent =
            song.artist;

          info.appendChild(
            title
          );

          info.appendChild(
            artist
          );

          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "music-actions";

          const playButton =
            document.createElement(
              "a"
            );

          playButton.className =
            "play-button";

          playButton.href =
            getSongURL(
              song
            );

          playButton.target =
            "_blank";

          playButton.rel =
            "noopener noreferrer";

          playButton.textContent =
            "YouTube Music에서 듣기";

          playButton.addEventListener(
            "click",
            function() {
              highlightSong(
                index
              );

              nowPlaying.style.display =
                "block";

              nowPlaying.textContent =
                "▶ " +
                song.title +
                " — " +
                song.artist;
            }
          );

          const removeButton =
            document.createElement(
              "button"
            );

          removeButton.className =
            "remove-button";

          removeButton.type =
            "button";

          removeButton.textContent =
            "♥";

          removeButton.setAttribute(
            "aria-label",
            "저장한 노래 삭제"
          );

          removeButton.addEventListener(
            "click",
            function() {
              removeSong(
                index
              );
            }
          );

          actions.appendChild(
            playButton
          );

          actions.appendChild(
            removeButton
          );

          item.appendChild(
            info
          );

          item.appendChild(
            actions
          );

          musicList.appendChild(
            item
          );
        }
      );
    }

    playAllButton.addEventListener(
      "click",
      playFirstSong
    );

    backButton.addEventListener(
      "click",
      function() {
        window.location.href =
          "./mood.html";
      }
    );

    renderPlaylist();
  </script>

</body>
</html>
