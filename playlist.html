<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - My Music</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #031118;
      color: #ffffff;
    }

    button {
      font-family: inherit;
    }

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(30px + env(safe-area-inset-top))
        20px
        calc(40px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow-x: hidden;
      overflow-y: auto;

      background-image:
        linear-gradient(
          180deg,
          rgba(2, 13, 19, 0.78) 0%,
          rgba(2, 15, 22, 0.88) 45%,
          rgba(2, 11, 16, 0.97) 100%
        ),
        url("./main.jpeg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .page::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      top: 420px;
      right: -170px;

      border-radius: 50%;

      background:
        rgba(61, 212, 226, 0.11);

      filter: blur(65px);

      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-spacer {
      width: 38px;
      height: 38px;
    }

    .logo {
      color: #ffffff;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 5px;
    }

    .logo-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #6ce8ee;

      box-shadow:
        0 0 14px
        rgba(108, 232, 238, 0.9);
    }

    .playlist-head {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 44px;
    }

    .playlist-title {
      margin: 0;

      color: #ffffff;

      font-size:
        clamp(32px, 8vw, 44px);

      line-height: 1.12;

      font-weight: 670;

      letter-spacing: -2px;
    }

    .playlist-subtitle {
      margin: 11px 0 0;

      color:
        rgba(203, 230, 234, 0.58);

      font-size: 14px;
      line-height: 1.6;
    }

    .play-all-button {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 28px;
      padding: 16px 20px;

      border: none;
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #dffbfb 0%,
          #a8eef2 100%
        );

      color: #06202a;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease;
    }

    .play-all-button:active {
      transform: scale(0.97);
    }

    .now-playing {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 12px;
      padding: 13px 16px;

      border:
        1px solid
        rgba(108, 232, 238, 0.15);

      border-radius: 15px;

      background:
        rgba(108, 232, 238, 0.07);

      color: #bcebef;

      text-align: center;

      font-size: 12px;
      line-height: 1.5;
    }

    .music-list {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 24px;

      display: flex;
      flex-direction: column;

      gap: 11px;
    }

    .music-item {
      width: 100%;

      padding: 17px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.085),
          rgba(255, 255, 255, 0.035)
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.16);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        border 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .music-item.selected {
      border-color:
        rgba(108, 232, 238, 0.55);

      transform:
        translateY(-2px);

      box-shadow:
        0 0 18px
        rgba(108, 232, 238, 0.10);
    }

    .music-info {
      width: 100%;

      margin-bottom: 15px;
    }

    .music-name {
      margin: 0;

      color: #f5fcfd;

      font-size: 17px;
      font-weight: 600;

      line-height: 1.4;
    }

    .music-artist {
      margin: 5px 0 0;

      color: #7f9ca5;

      font-size: 13px;
      line-height: 1.4;
    }

    .music-actions {
      width: 100%;

      display: flex;

      gap: 8px;
    }

    .play-button {
      flex: 1;

      min-height: 43px;

      padding: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #dffbfb 0%,
          #a8eef2 100%
        );

      color: #06202a;

      text-decoration: none;
      text-align: center;

      font-size: 13px;
      font-weight: 650;
    }

    .remove-button {
      width: 48px;
      min-width: 48px;
      min-height: 43px;

      border:
        1px solid
        rgba(108, 232, 238, 0.25);

      border-radius: 13px;

      background:
        rgba(108, 232, 238, 0.12);

      color: #6ce8ee;

      font-size: 20px;

      cursor: pointer;

      box-shadow:
        0 0 14px
        rgba(108, 232, 238, 0.10);
    }

    .remove-button:active {
      transform: scale(0.9);
    }

    .empty-message {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 32px;

      padding: 38px 24px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.035)
        );

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      text-align: center;

      color:
        rgba(203, 230, 234, 0.58);

      font-size: 14px;
      line-height: 1.7;
    }

    .empty-heart {
      display: block;

      margin-bottom: 14px;

      color: #6ce8ee;

      font-size: 40px;
    }

    .back-button {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 18px;
      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #708b93;

      font-size: 13px;

      cursor: pointer;
    }

    @media (min-width: 700px) {
      .page {
        padding-left:
          max(40px, calc((100vw - 520px) / 2));

        padding-right:
          max(40px, calc((100vw - 520px) / 2));
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .playlist-head {
        margin-top: 36px;
      }

      .music-item {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top">

      <div class="top-spacer"></div>

      <div class="logo">
        SHARK
      </div>

      <div class="logo-dot"></div>

    </header>

    <section class="playlist-head">

      <h1 class="playlist-title">
        MY MUSIC
      </h1>

      <p class="playlist-subtitle">
        내가 좋아하는 노래만 모아봤어.
      </p>

    </section>

    <button
      class="play-all-button"
      id="playAllButton"
      type="button"
    >
      ▶ 첫 곡부터 듣기
    </button>

    <div
      class="now-playing"
      id="nowPlaying"
      style="display: none;"
    ></div>

    <div
      class="music-list"
      id="musicList"
    ></div>

    <div
      class="empty-message"
      id="emptyMessage"
      style="display: none;"
    >
      <span class="empty-heart">
        ♡
      </span>

      아직 저장한 노래가 없어.<br>
      마음에 드는 노래에<br>
      ♥를 눌러 저장해봐.
    </div>

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 기분 고르기
    </button>

  </main>

  <script>
    let savedSongs = [];

    try {
      savedSongs =
        JSON.parse(
          localStorage.getItem(
            "sharkPlaylist"
          ) || "[]"
        );

      if (
        !Array.isArray(
          savedSongs
        )
      ) {
        savedSongs = [];
      }
    }
    catch (error) {
      savedSongs = [];
    }

    const musicList =
      document.getElementById(
        "musicList"
      );

    const emptyMessage =
      document.getElementById(
        "emptyMessage"
      );

    const playAllButton =
      document.getElementById(
        "playAllButton"
      );

    const nowPlaying =
      document.getElementById(
        "nowPlaying"
      );

    const backButton =
      document.getElementById(
        "backButton"
      );

    function getYouTubeMusicURL(
      song
    ) {
      const searchText =
        song.title +
        " " +
        song.artist;

      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(
          searchText
        )
      );
    }

    function getSongURL(
      song
    ) {
      if (
        song.url &&
        typeof song.url === "string"
      ) {
        return song.url;
      }

      return getYouTubeMusicURL(
        song
      );
    }

    function openMusic(
      song
    ) {
      if (!song) {
        return;
      }

      window.open(
        getSongURL(
          song
        ),
        "_blank",
        "noopener,noreferrer"
      );
    }

    function playFirstSong() {
      if (
        savedSongs.length === 0
      ) {
        return;
      }

      const firstSong =
        savedSongs[0];

      nowPlaying.style.display =
        "block";

      nowPlaying.textContent =
        "▶ " +
        firstSong.title +
        " — " +
        firstSong.artist +
        "부터 들어볼 수 있어.";

      openMusic(
        firstSong
      );

      highlightSong(
        0
      );
    }

    function highlightSong(
      index
    ) {
      const items =
        document.querySelectorAll(
          ".music-item"
        );

      items.forEach(
        function(
          item,
          itemIndex
        ) {
          item.classList.toggle(
            "selected",
            itemIndex === index
          );
        }
      );
    }

    function savePlaylist() {
      localStorage.setItem(
        "sharkPlaylist",
        JSON.stringify(
          savedSongs
        )
      );
    }

    function removeSong(
      index
    ) {
      savedSongs.splice(
        index,
        1
      );

      savePlaylist();

      nowPlaying.style.display =
        "none";

      renderPlaylist();
    }

    function renderPlaylist() {
      musicList.innerHTML =
        "";

      if (
        savedSongs.length === 0
      ) {
        musicList.style.display =
          "none";

        emptyMessage.style.display =
          "block";

        playAllButton.style.display =
          "none";

        nowPlaying.style.display =
          "none";

        return;
      }

      musicList.style.display =
        "flex";

      emptyMessage.style.display =
        "none";

      playAllButton.style.display =
        "block";

      savedSongs.forEach(
        function(
          song,
          index
        ) {
          const item =
            document.createElement(
              "article"
            );

          item.className =
            "music-item";

          const info =
            document.createElement(
              "div"
            );

          info.className =
            "music-info";

          const title =
            document.createElement(
              "h2"
            );

          title.className =
            "music-name";

          title.textContent =
            song.title;

          const artist =
            document.createElement(
              "p"
            );

          artist.className =
            "music-artist";

          artist.textContent =
            song.artist;

          info.appendChild(
            title
          );

          info.appendChild(
            artist
          );

          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "music-actions";

          const playButton =
            document.createElement(
              "a"
            );

          playButton.className =
            "play-button";

          playButton.href =
            getSongURL(
              song
            );

          playButton.target =
            "_blank";

          playButton.rel =
            "noopener noreferrer";

          playButton.textContent =
            "YouTube Music에서 듣기";

          playButton.addEventListener(
            "click",
            function() {
              highlightSong(
                index
              );

              nowPlaying.style.display =
                "block";

              nowPlaying.textContent =
                "▶ " +
                song.title +
                " — " +
                song.artist;
            }
          );

          const removeButton =
            document.createElement(
              "button"
            );

          removeButton.className =
            "remove-button";

          removeButton.type =
            "button";

          removeButton.textContent =
            "♥";

          removeButton.setAttribute(
            "aria-label",
            "저장한 노래 삭제"
          );

          removeButton.addEventListener(
            "click",
            function() {
              removeSong(
                index
              );
            }
          );

          actions.appendChild(
            playButton
          );

          actions.appendChild(
            removeButton
          );

          item.appendChild(
            info
          );

          item.appendChild(
            actions
          );

          musicList.appendChild(
            item
          );
        }
      );
    }

    playAllButton.addEventListener(
      "click",
      playFirstSong
    );

    backButton.addEventListener(
      "click",
      function() {
        window.location.href =
          "./mood.html";
      }
    );

    renderPlaylist();
  </script>

</body>
</html>
