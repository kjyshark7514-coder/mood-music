<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHARK</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #ffffff;
      color: #10202a;
    }

    .app {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      opacity: 0;
      visibility: hidden;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    /* 첫 화면 */

    #homePage {
      justify-content: space-between;

      background-image: url("main.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .logo {
      text-align: center;
      color: #10202a;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .home-content {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      transform: translateY(-220px);
    }

    .home-title {
      margin: 0;

      color: #10202a;

      font-size: clamp(32px, 8vw, 48px);
      line-height: 1.25;

      font-weight: 600;
      letter-spacing: -1.8px;
    }

    .home-title span {
      display: block;
    }

    /* 듣기 버튼 */

    .listen-button {
      display: block;

      width: 100%;

      padding: 18px 20px;

      border: none;
      border-radius: 20px;

      background: #10202a;
      color: white;

      font-size: 18px;
      font-weight: 500;

      letter-spacing: 1px;

      text-align: center;
      text-decoration: none;

      cursor: pointer;

      transition: transform 0.15s ease;
    }

    .listen-button:active {
      transform: scale(0.98);
    }

    /* 작은 화면 */

    @media (max-width: 380px) {

      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .home-title {
        font-size: 32px;
      }
    }

  </style>
</head>

<body>

  <main class="app">

    <!-- 첫 화면 -->

    <section class="page active" id="homePage">

      <div class="logo">
        SHARK
      </div>


      <div class="home-content">

        <h1 class="home-title">
          <span>네 기분만 줘.</span>
          <span>노래는 내가 고를게</span>
        </h1>

      </div>


      <!-- mood.html로 이동 -->

      <a
        href="./mood.html"
        class="listen-button"
      >
        듣 기
      </a>

    </section>

  </main>

</body>
</html>
