<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Mood</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #031118;
      color: #ffffff;
    }

    button {
      font-family: inherit;
    }

    .page {
      position: relative;

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(30px + env(safe-area-inset-top))
        22px
        calc(30px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(68, 224, 231, 0.18),
          transparent 40%
        ),
        linear-gradient(
          180deg,
          #031118 0%,
          #06141d 50%,
          #020b10 100%
        );
    }

    .page::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      bottom: 80px;
      right: -170px;

      border-radius: 50%;

      background:
        rgba(61, 212, 226, 0.11);

      filter: blur(65px);

      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.10);

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.055);

      color: #c7e8ec;

      font-size: 18px;

      cursor: pointer;
    }

    .logo {
      color: #ffffff;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 5px;
    }

    .logo-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #6ce8ee;

      box-shadow:
        0 0 14px
        rgba(108, 232, 238, 0.9);
    }

    .intro {
      position: relative;
      z-index: 2;

      margin-top: 48px;
    }

    .title {
      margin: 0;

      color: #ffffff;

      font-size:
        clamp(31px, 8vw, 42px);

      line-height: 1.12;

      font-weight: 670;

      letter-spacing: -2px;
    }

    .title span {
      color: #a9f5f5;
    }

    .subtitle {
      margin: 12px 0 0;

      color:
        rgba(203, 230, 234, 0.58);

      font-size: 14px;
      line-height: 1.6;
    }

    .mood-grid {
      position: relative;
      z-index: 2;

      width: 100%;

      margin-top: 34px;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 11px;
    }

    .mood-button {
      position: relative;

      min-height: 104px;

      padding: 15px 16px;

      display: flex;
      align-items: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.085),
          rgba(255, 255, 255, 0.035)
        );

      color: #ffffff;

      cursor: pointer;

      overflow: hidden;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 0.18s ease,
        border 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .mood-button::after {
      content: "";

      position: absolute;

      width: 70px;
      height: 70px;

      top: -35px;
      right: -30px;

      border-radius: 50%;

      background:
        rgba(89, 217, 230, 0.07);

      filter: blur(15px);
    }

    .mood-button:active {
      transform: scale(0.97);
    }

    .mood-button.selected {
      border:
        1px solid
        rgba(112, 233, 240, 0.65);

      background:
        linear-gradient(
          145deg,
          rgba(90, 218, 230, 0.19),
          rgba(61, 159, 178, 0.09)
        );

      box-shadow:
        0 0 0 1px
        rgba(90, 220, 232, 0.08),
        0 12px 30px
        rgba(0, 0, 0, 0.23);
    }

    .emoji {
      width: 52px;
      height: 52px;

      min-width: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.07);

      font-size: 29px;
    }

    .mood-copy {
      margin-left: 13px;

      text-align: left;
    }

    .mood-name {
      display: block;

      color: #eefcfd;

      font-size: 16px;
      font-weight: 650;
    }

    .mood-description {
      display: block;

      margin-top: 5px;

      color:
        rgba(186, 215, 220, 0.48);

      font-size: 10px;

      line-height: 1.35;
    }

    .recommend-wrap {
      position: relative;
      z-index: 2;

      margin-top: auto;
      padding-top: 25px;
    }

    .recommend-button {
      width: 100%;

      min-height: 61px;

      padding:
        0 18px 0 21px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: none;
      border-radius: 19px;

      background:
        linear-gradient(
          135deg,
          #dffbfb 0%,
          #a8eef2 100%
        );

      color: #06202a;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      opacity: 0;
      visibility: hidden;

      transform: translateY(10px);

      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .recommend-button.visible {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);

      pointer-events: auto;
    }

    .arrow {
      width: 35px;
      height: 35px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(7, 34, 42, 0.10);

      font-size: 18px;
    }

    @media (min-width: 700px) {
      .page {
        padding-left:
          max(40px, calc((100vw - 520px) / 2));

        padding-right:
          max(40px, calc((100vw - 520px) / 2));
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 17px;
        padding-right: 17px;
      }

      .intro {
        margin-top: 38px;
      }

      .mood-grid {
        margin-top: 26px;
        gap: 9px;
      }

      .mood-button {
        min-height: 92px;
        padding: 12px;
        border-radius: 19px;
      }

      .emoji {
        width: 44px;
        height: 44px;
        min-width: 44px;

        font-size: 25px;

        border-radius: 14px;
      }

      .mood-copy {
        margin-left: 10px;
      }

      .mood-name {
        font-size: 14px;
      }

      .mood-description {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top">

      <button
        class="back"
        id="backButton"
        type="button"
        aria-label="뒤로 가기"
      >
        ←
      </button>

      <div class="logo">
        SHARK
      </div>

      <div class="logo-dot"></div>

    </header>

    <section class="intro">

      <h1 class="title">
        지금 기분은<br>
        <span>어떤 쪽이야?</span>
      </h1>

      <p class="subtitle">
        가장 가까운 감정 하나만 골라줘.
      </p>

    </section>

    <div class="mood-grid">

      <button
        class="mood-button"
        type="button"
        data-mood="행복"
        aria-pressed="false"
      >
        <span class="emoji">😊</span>

        <span class="mood-copy">
          <span class="mood-name">행복</span>
          <span class="mood-description">밝고 기분 좋은 순간</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="사랑"
        aria-pressed="false"
      >
        <span class="emoji">💗</span>

        <span class="mood-copy">
          <span class="mood-name">사랑</span>
          <span class="mood-description">설레고 따뜻한 마음</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="슬픔"
        aria-pressed="false"
      >
        <span class="emoji">😢</span>

        <span class="mood-copy">
          <span class="mood-name">슬픔</span>
          <span class="mood-description">혼자 있고 싶은 밤</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="화남"
        aria-pressed="false"
      >
        <span class="emoji">😡</span>

        <span class="mood-copy">
          <span class="mood-name">화남</span>
          <span class="mood-description">답답함을 날리고 싶을 때</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="피곤"
        aria-pressed="false"
      >
        <span class="emoji">😴</span>

        <span class="mood-copy">
          <span class="mood-name">피곤</span>
          <span class="mood-description">힘을 빼고 쉬고 싶은 날</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="위로"
        aria-pressed="false"
      >
        <span class="emoji">🥺</span>

        <span class="mood-copy">
          <span class="mood-name">위로</span>
          <span class="mood-description">조용히 기대고 싶은 순간</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="신남"
        aria-pressed="false"
      >
        <span class="emoji">🤩</span>

        <span class="mood-copy">
          <span class="mood-name">신남</span>
          <span class="mood-description">에너지가 필요한 지금</span>
        </span>
      </button>

      <button
        class="mood-button"
        type="button"
        data-mood="SHARK"
        aria-pressed="false"
      >
        <span class="emoji">🦈</span>

        <span class="mood-copy">
          <span class="mood-name">SHARK</span>
          <span class="mood-description">바다 · 새벽 · 드라이브</span>
        </span>
      </button>

    </div>

    <div class="recommend-wrap">

      <button
        class="recommend-button"
        id="recommendButton"
        type="button"
      >
        <span>
          이 기분으로 음악 찾기
        </span>

        <span class="arrow">
          →
        </span>
      </button>

    </div>

  </main>

  <script>
    const moodButtons =
      document.querySelectorAll(
        ".mood-button"
      );

    const recommendButton =
      document.getElementById(
        "recommendButton"
      );

    const backButton =
      document.getElementById(
        "backButton"
      );

    let selectedMood = null;

    moodButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            moodButtons.forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

                item.setAttribute(
                  "aria-pressed",
                  "false"
                );

              }
            );

            button.classList.add(
              "selected"
            );

            button.setAttribute(
              "aria-pressed",
              "true"
            );

            selectedMood =
              button.dataset.mood;

            recommendButton.classList.add(
              "visible"
            );

          }
        );

      }
    );

    recommendButton.addEventListener(
      "click",
      function() {

        if (!selectedMood) {
          return;
        }

        window.location.href =
          "./result.html?mood=" +
          encodeURIComponent(
            selectedMood
          );

      }
    );

    backButton.addEventListener(
      "click",
      function() {
        window.location.href =
          "./index.html";
      }
    );
  </script>

</body>
</html>
