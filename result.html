<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #031118;
      color: #ffffff;
    }

    button {
      font-family: inherit;
    }

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(30px + env(safe-area-inset-top))
        20px
        calc(40px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow-x: hidden;
      overflow-y: auto;

      background-image:
        linear-gradient(
          180deg,
          rgba(2, 13, 19, 0.78) 0%,
          rgba(2, 15, 22, 0.88) 45%,
          rgba(2, 11, 16, 0.97) 100%
        ),
        url("./main.jpeg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .page::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      top: 430px;
      right: -170px;

      border-radius: 50%;

      background:
        rgba(61, 212, 226, 0.11);

      filter: blur(65px);

      pointer-events: none;
    }

    .top {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-spacer {
      width: 38px;
      height: 38px;
    }

    .logo {
      color: #ffffff;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: 5px;
    }

    .logo-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #6ce8ee;

      box-shadow:
        0 0 14px
        rgba(108, 232, 238, 0.9);
    }

    .result-head {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 44px;
    }

    .result-title {
      margin: 0;

      color: #ffffff;

      font-size:
        clamp(30px, 8vw, 42px);

      line-height: 1.12;

      font-weight: 670;

      letter-spacing: -2px;
    }

    .mood-summary {
      width: 100%;

      margin-top: 22px;
      padding: 15px;

      display: flex;
      align-items: center;

      gap: 14px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.085),
          rgba(255, 255, 255, 0.035)
        );

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .selected-mood-wrap {
      width: 58px;
      height: 58px;
      min-width: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.07);

      border:
        1px solid
        rgba(108, 232, 238, 0.15);
    }

    .selected-mood {
      font-size: 31px;
      line-height: 1;
    }

    .mood-text {
      margin: 0;

      color:
        rgba(203, 230, 234, 0.62);

      font-size: 13px;
      line-height: 1.55;
    }

    .genre-section {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 24px;
    }

    .genre-row {
      width: 100%;

      display: flex;

      padding: 4px;
      gap: 4px;

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.055);

      border:
        1px solid
        rgba(255, 255, 255, 0.07);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .genre-button {
      flex: 1;
      min-width: 0;

      padding: 12px 5px;

      border: none;
      border-radius: 13px;

      background: transparent;

      color: #7f9ca5;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }

    .genre-button.active {
      background:
        linear-gradient(
          135deg,
          #dffbfb 0%,
          #a8eef2 100%
        );

      color: #06202a;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, 0.16);
    }

    .genre-button:active {
      transform: scale(0.96);
    }

    .music-list {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      margin-top: 17px;

      display: flex;
      flex-direction: column;

      gap: 11px;
    }

    .music-card {
      position: relative;

      width: 100%;

      padding: 17px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.085),
          rgba(255, 255, 255, 0.035)
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.16);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      overflow: hidden;
    }

    .music-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 3px;
      height: 100%;

      background:
        linear-gradient(
          180deg,
          #6ce8ee,
          rgba(108, 232, 238, 0.03)
        );
    }

    .music-top {
      display: flex;
      align-items: flex-start;

      gap: 13px;
    }

    .music-number {
      width: 30px;
      min-width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background:
        rgba(108, 232, 238, 0.09);

      color: #6ce8ee;

      font-size: 11px;
      font-weight: 700;
    }

    .music-info {
      flex: 1;
      min-width: 0;
    }

    .music-title {
      margin: 1px 0 4px;

      color: #f5fcfd;

      font-size: 17px;
      font-weight: 600;

      line-height: 1.35;
    }

    .music-artist {
      margin: 0;

      color: #7f9ca5;

      font-size: 13px;
      line-height: 1.4;
    }

    .button-row {
      width: 100%;

      margin-top: 15px;

      display: flex;

      gap: 8px;
    }

    .music-button {
      flex: 1;

      min-height: 43px;

      padding: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #dffbfb 0%,
          #a8eef2 100%
        );

      color: #06202a;

      text-align: center;
      text-decoration: none;

      font-size: 13px;
      font-weight: 650;
    }

    .heart-button {
      width: 48px;
      min-width: 48px;
      min-height: 43px;

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.055);

      color: #a5c0c7;

      font-size: 20px;

      cursor: pointer;
    }

    .heart-button.saved {
      background:
        rgba(108, 232, 238, 0.14);

      border-color:
        rgba(108, 232, 238, 0.28);

      color: #6ce8ee;

      box-shadow:
        0 0 16px
        rgba(108, 232, 238, 0.18);
    }

    .action-button {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;

      cursor: pointer;
    }

    .random-button {
      margin-top: 17px;

      padding: 14px 20px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 15px;

      background:
        rgba(255, 255, 255, 0.045);

      color: #a9c2c8;

      font-size: 13px;
    }

    .playlist-button {
      margin-top: 11px;

      padding: 15px 20px;

      border:
        1px solid
        rgba(108, 232, 238, 0.20);

      border-radius: 16px;

      background:
        rgba(108, 232, 238, 0.08);

      color: #c6f5f7;

      font-size: 13px;
      font-weight: 650;
    }

    .back-button {
      margin-top: 12px;

      padding: 11px 20px;

      border: none;

      background: transparent;

      color: #6f8991;

      font-size: 13px;
    }

    @media (min-width: 700px) {
      .page {
        padding-left:
          max(40px, calc((100vw - 520px) / 2));

        padding-right:
          max(40px, calc((100vw - 520px) / 2));
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .result-head {
        margin-top: 36px;
      }

      .music-card {
        padding: 15px;
      }

      .genre-button {
        padding-left: 2px;
        padding-right: 2px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top">

      <div class="top-spacer"></div>

      <div class="logo">
        SHARK
      </div>

      <div class="logo-dot"></div>

    </header>


    <section class="result-head">

      <h1 class="result-title">
        오늘은 이런 노래 어때?
      </h1>

      <div class="mood-summary">

        <div class="selected-mood-wrap">

          <div
            class="selected-mood"
            id="selectedMood"
          >
            😊
          </div>

        </div>

        <p
          class="mood-text"
          id="moodText"
        ></p>

      </div>

    </section>


    <section class="genre-section">

      <div class="genre-row">

        <button
          class="genre-button active"
          type="button"
          data-genre="ALL"
        >
          전체
        </button>

        <button
          class="genre-button"
          type="button"
          data-genre="KPOP"
        >
          K-POP
        </button>

        <button
          class="genre-button"
          type="button"
          data-genre="POP"
        >
          POP
        </button>

        <button
          class="genre-button"
          type="button"
          data-genre="INDIE"
        >
          INDIE
        </button>

      </div>

    </section>


    <div
      class="music-list"
      id="musicList"
    ></div>


    <button
      class="action-button random-button"
      id="randomButton"
      type="button"
    >
      다른 노래 추천
    </button>


    <button
      class="action-button playlist-button"
      id="playlistButton"
      type="button"
    >
      MY MUSIC
    </button>


    <button
      class="action-button back-button"
      id="backButton"
      type="button"
    >
      다시 고르기
    </button>

  </main>


  <script src="./music-data.js"></script>


  <script>

    const params =
      new URLSearchParams(
        window.location.search
      );


    const requestedMood =
      params.get("mood");


    const currentMood =
      (
        requestedMood &&
        typeof musicData !== "undefined" &&
        musicData[requestedMood]
      )
        ? requestedMood
        : "행복";


    let currentGenre =
      "ALL";


    let currentMusicList =
      [];


    const selectedMood =
      document.getElementById(
        "selectedMood"
      );


    const moodText =
      document.getElementById(
        "moodText"
      );


    const musicList =
      document.getElementById(
        "musicList"
      );


    const randomButton =
      document.getElementById(
        "randomButton"
      );


    const playlistButton =
      document.getElementById(
        "playlistButton"
      );


    const backButton =
      document.getElementById(
        "backButton"
      );


    const moodEmoji = {

      "행복": "😊",

      "사랑": "💗",

      "슬픔": "😢",

      "화남": "😡",

      "피곤": "😴",

      "위로": "🥺",

      "신남": "🤩",

      "SHARK": "🦈"

    };


    const moodMessage = {

      "행복":
        "기분을 더 밝게 만들어줄 노래를 골라봤어.",

      "사랑":
        "설레는 마음에 어울리는 노래를 골라봤어.",

      "슬픔":
        "조용히 감정에 머물 수 있는 노래를 골라봤어.",

      "화남":
        "답답한 기분을 시원하게 날려줄 노래를 골라봤어.",

      "피곤":
        "힘을 빼고 편하게 들을 수 있는 노래를 골라봤어.",

      "위로":
        "오늘 너에게 따뜻하게 닿을 노래를 골라봤어.",

      "신남":
        "지금 에너지를 더 끌어올릴 노래를 골라봤어.",

      "SHARK":
        "몽환적인 바다와 새벽 드라이브에 어울리는 노래를 골라봤어."

    };


    let savedSongs =
      [];


    try {

      savedSongs =
        JSON.parse(
          localStorage.getItem(
            "sharkPlaylist"
          ) || "[]"
        );


      if (
        !Array.isArray(
          savedSongs
        )
      ) {

        savedSongs =
          [];

      }

    }

    catch (error) {

      savedSongs =
        [];

    }


    const HISTORY_KEY =
      "sharkRecommendationHistoryV5";


    const LAST_KEY =
      "sharkLastRecommendationsV5";


    function loadObject(
      key
    ) {

      try {

        const value =
          JSON.parse(
            sessionStorage.getItem(
              key
            ) || "{}"
          );


        if (
          value &&
          typeof value === "object"
        ) {

          return value;

        }


        return {};

      }

      catch (error) {

        return {};

      }

    }


    function saveObject(
      key,
      value
    ) {

      sessionStorage.setItem(
        key,
        JSON.stringify(
          value
        )
      );

    }


    function songKey(
      music
    ) {

      return (
        music.title
          .trim()
          .toLowerCase()
        +
        "|||"
        +
        music.artist
          .trim()
          .toLowerCase()
      );

    }


    function uniqueSongs(
      list
    ) {

      const seen =
        new Set();


      return list.filter(
        function(
          music
        ) {

          const key =
            songKey(
              music
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );

    }


    function shuffleArray(
      array
    ) {

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random()
            *
            (
              i + 1
            )
          );


        const temp =
          result[i];


        result[i] =
          result[j];


        result[j] =
          temp;

      }


      return result;

    }


    function getGenrePool(
      moodName,
      genreName
    ) {

      const moodData =
        musicData[
          moodName
        ];


      if (
        !moodData
      ) {

        return [];

      }


      if (
        genreName === "KPOP"
      ) {

        return uniqueSongs(
          moodData.KPOP || []
        );

      }


      if (
        genreName === "POP"
      ) {

        return uniqueSongs(
          moodData.POP || []
        );

      }


      if (
        genreName === "INDIE"
      ) {

        return uniqueSongs(
          moodData.INDIE || []
        );

      }


      return uniqueSongs(
        [
          ...(moodData.KPOP || []),
          ...(moodData.POP || []),
          ...(moodData.INDIE || [])
        ]
      );

    }


    function getFiveMusic(
      moodName,
      genreName
    ) {

      const pool =
        getGenrePool(
          moodName,
          genreName
        );


      if (
        pool.length === 0
      ) {

        return [];

      }


      const history =
        loadObject(
          HISTORY_KEY
        );


      const lastHistory =
        loadObject(
          LAST_KEY
        );


      const historyId =
        moodName
        +
        "_"
        +
        genreName;


      const seenSongs =
        new Set(
          history[
            historyId
          ] || []
        );


      let unseenSongs =
        pool.filter(
          function(
            music
          ) {

            return (
              !seenSongs.has(
                songKey(
                  music
                )
              )
            );

          }
        );


      const requiredCount =
        Math.min(
          5,
          pool.length
        );


      if (
        unseenSongs.length
        <
        requiredCount
      ) {

        const lastSongs =
          new Set(
            lastHistory[
              historyId
            ] || []
          );


        const freshPool =
          pool.filter(
            function(
              music
            ) {

              return (
                !lastSongs.has(
                  songKey(
                    music
                  )
                )
              );

            }
          );


        seenSongs.clear();


        unseenSongs =
          freshPool.length
          >=
          requiredCount
            ? freshPool
            : [...pool];

      }


      const selected =
        shuffleArray(
          unseenSongs
        ).slice(
          0,
          5
        );


      selected.forEach(
        function(
          music
        ) {

          seenSongs.add(
            songKey(
              music
            )
          );

        }
      );


      history[
        historyId
      ]
      =
      [
        ...seenSongs
      ];


      lastHistory[
        historyId
      ]
      =
      selected.map(
        songKey
      );


      saveObject(
        HISTORY_KEY,
        history
      );


      saveObject(
        LAST_KEY,
        lastHistory
      );


      return selected;

    }


    function getMusicURL(
      music
    ) {

      const searchText =
        music.title
        +
        " "
        +
        music.artist;


      return (
        "https://music.youtube.com/search?q="
        +
        encodeURIComponent(
          searchText
        )
      );

    }


    function isSaved(
      music
    ) {

      return savedSongs.some(
        function(
          song
        ) {

          return (
            song.title
            ===
            music.title
            &&
            song.artist
            ===
            music.artist
          );

        }
      );

    }


    function renderMusicList(
      musicArray
    ) {

      currentMusicList =
        musicArray;


      musicList.innerHTML =
        "";


      if (
        musicArray.length === 0
      ) {

        const emptyMessage =
          document.createElement(
            "div"
          );


        emptyMessage.style.padding =
          "30px 12px";


        emptyMessage.style.textAlign =
          "center";


        emptyMessage.style.color =
          "#7f9ca5";


        emptyMessage.style.fontSize =
          "13px";


        emptyMessage.textContent =
          "추천할 노래를 찾지 못했어.";


        musicList.appendChild(
          emptyMessage
        );


        return;

      }


      musicArray.forEach(
        function(
          music,
          index
        ) {

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "music-card";


          const top =
            document.createElement(
              "div"
            );


          top.className =
            "music-top";


          const number =
            document.createElement(
              "div"
            );


          number.className =
            "music-number";


          number.textContent =
            String(
              index + 1
            ).padStart(
              2,
              "0"
            );


          const info =
            document.createElement(
              "div"
            );


          info.className =
            "music-info";


          const title =
            document.createElement(
              "h2"
            );


          title.className =
            "music-title";


          title.textContent =
            music.title;


          const artist =
            document.createElement(
              "p"
            );


          artist.className =
            "music-artist";


          artist.textContent =
            music.artist;


          info.appendChild(
            title
          );


          info.appendChild(
            artist
          );


          top.appendChild(
            number
          );


          top.appendChild(
            info
          );


          const buttonRow =
            document.createElement(
              "div"
            );


          buttonRow.className =
            "button-row";


          const musicButton =
            document.createElement(
              "a"
            );


          musicButton.className =
            "music-button";


          musicButton.href =
            getMusicURL(
              music
            );


          musicButton.target =
            "_blank";


          musicButton.rel =
            "noopener noreferrer";


          musicButton.textContent =
            "YouTube Music에서 듣기";


          const heartButton =
            document.createElement(
              "button"
            );


          heartButton.className =
            "heart-button";


          heartButton.type =
            "button";


          if (
            isSaved(
              music
            )
          ) {

            heartButton.textContent =
              "♥";


            heartButton.classList.add(
              "saved"
            );

          }

          else {

            heartButton.textContent =
              "♡";

          }


          heartButton.addEventListener(
            "click",
            function() {

              const existingIndex =
                savedSongs.findIndex(
                  function(
                    song
                  ) {

                    return (
                      song.title
                      ===
                      music.title
                      &&
                      song.artist
                      ===
                      music.artist
                    );

                  }
                );


              if (
                existingIndex !== -1
              ) {

                savedSongs.splice(
                  existingIndex,
                  1
                );

              }

              else {

                savedSongs.push(
                  {

                    title:
                      music.title,

                    artist:
                      music.artist,

                    url:
                      getMusicURL(
                        music
                      )

                  }
                );

              }


              localStorage.setItem(
                "sharkPlaylist",
                JSON.stringify(
                  savedSongs
                )
              );


              renderMusicList(
                currentMusicList
              );

            }
          );


          buttonRow.appendChild(
            musicButton
          );


          buttonRow.appendChild(
            heartButton
          );


          card.appendChild(
            top
          );


          card.appendChild(
            buttonRow
          );


          musicList.appendChild(
            card
          );

        }
      );

    }


    function recommendMusic() {

      const musicArray =
        getFiveMusic(
          currentMood,
          currentGenre
        );


      renderMusicList(
        musicArray
      );

    }


    selectedMood.textContent =
      moodEmoji[
        currentMood
      ]
      ||
      "😊";


    moodText.textContent =
      moodMessage[
        currentMood
      ]
      ||
      "";


    recommendMusic();


    const genreButtons =
      document.querySelectorAll(
        ".genre-button"
      );


    genreButtons.forEach(
      function(
        button
      ) {

        button.addEventListener(
          "click",
          function() {

            genreButtons.forEach(
              function(
                item
              ) {

                item.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            currentGenre =
              button.dataset.genre;


            recommendMusic();

          }
        );

      }
    );


    randomButton.addEventListener(
      "click",
      function() {

        recommendMusic();


        window.scrollTo(
          {
            top: 0,
            behavior: "smooth"
          }
        );

      }
    );


    playlistButton.addEventListener(
      "click",
      function() {

        window.location.href =
          "./playlist.html";

      }
    );


    backButton.addEventListener(
      "click",
      function() {

        window.location.href =
          "./mood.html";

      }
    );

  </script>

</body>
</html>
