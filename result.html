<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }


    /* 전체 페이지 */

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #dff4f6;
    }


    /* 로고 */

    .logo {
      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
    }


    /* 제목 */

    .result-title {
      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;
      letter-spacing: -1.5px;
    }


    /* 선택한 기분 */

    .selected-mood {
      margin-top: 25px;

      font-size: 64px;
      line-height: 1;
    }


    /* 기분 설명 */

    .mood-text {
      margin-top: 20px;

      text-align: center;

      font-size: 17px;
      line-height: 1.5;

      color: #4b626b;
    }


    /* 장르 선택 */

    .genre-title {
      width: 100%;
      max-width: 420px;

      margin-top: 32px;
      margin-bottom: 12px;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 0.8px;

      color: #78909a;
    }


    .genre-row {
      width: 100%;
      max-width: 420px;

      display: flex;
      gap: 10px;
    }


    .genre-button {
      flex: 1;

      padding: 13px 10px;

      border: 1px solid
        rgba(16, 32, 42, 0.1);

      border-radius: 16px;

      background:
        rgba(255, 255, 255, 0.6);

      color: #526b74;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }


    .genre-button.active {
      background: #10202a;
      color: #ffffff;

      border-color: #10202a;
    }


    .genre-button:active {
      transform: scale(0.96);
    }


    /* 음악 목록 */

    .music-list {
      width: 100%;
      max-width: 420px;

      margin-top: 28px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }


    /* 음악 카드 */

    .music-card {
      width: 100%;

      padding: 20px;

      border-radius: 24px;

      background:
        rgba(255, 255, 255, 0.8);

      box-shadow:
        0 8px 24px
        rgba(16, 32, 42, 0.06);
    }


    /* 곡 번호 + 정보 */

    .music-top {
      display: flex;
      align-items: flex-start;

      gap: 14px;
    }


    .music-number {
      width: 30px;
      min-width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: #edf7f8;

      color: #607781;

      font-size: 13px;
      font-weight: 600;
    }


    .music-info {
      flex: 1;
      min-width: 0;
    }


    /* 노래 제목 */

    .music-title {
      margin: 2px 0 5px;

      font-size: 19px;

      font-weight: 600;

      color: #10202a;

      line-height: 1.3;
    }


    /* 아티스트 */

    .music-artist {
      margin: 0;

      font-size: 14px;

      color: #607781;

      line-height: 1.4;
    }


    /* 버튼 영역 */

    .button-row {
      display: flex;

      gap: 9px;

      width: 100%;

      margin-top: 17px;
    }


    /* YouTube Music */

    .music-button {
      flex: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 46px;

      padding: 11px 10px;

      border-radius: 15px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 14px;

      font-weight: 500;

      letter-spacing: 0.2px;
    }


    /* 하트 */

    .heart-button {
      width: 52px;
      min-width: 52px;

      min-height: 46px;

      border: none;

      border-radius: 15px;

      background: #edf7f8;

      color: #10202a;

      font-size: 22px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }


    .heart-button:active {
      transform: scale(0.88);
    }


    /* 저장된 상태 */

    .heart-button.saved {
      background: #10202a;
      color: #ffffff;
    }


    /* 다른 노래 */

    .random-button {
      width: 100%;
      max-width: 420px;

      margin-top: 18px;

      padding: 14px 20px;

      border: 1px solid
        rgba(16, 32, 42, 0.1);

      border-radius: 16px;

      background:
        rgba(255, 255, 255, 0.55);

      color: #526b74;

      font-size: 14px;

      cursor: pointer;
    }


    /* MY MUSIC */

    .playlist-button {
      width: 100%;
      max-width: 420px;

      margin-top: 22px;

      padding: 15px 20px;

      border: 1px solid
        rgba(16, 32, 42, 0.12);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.55);

      color: #10202a;

      font-size: 15px;

      font-weight: 500;

      letter-spacing: 0.3px;

      cursor: pointer;
    }

    .back-button {
      margin-top: 20px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;
    }

      .music-button {

    /* =========================================
       YouTube Music 검색 주소
    ========================================= */

    function getYouTubeMusicURL(
      music
    ) {

      const searchText =
        music.title +
        " " +
        music.artist;

      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(
          searchText
        )
      );

    }


    /* =========================================
       5곡 가져오기
    ========================================= */

    function getFiveMusic(
      moodName,
      genreName
    ) {

      const moodData =
        musicData[moodName];

      if (!moodData) {
        return [];
      }


      let list = [];


      if (
        genreName === "KPOP"
      ) {

        list =
          [...(moodData.KPOP || [])];

      }

      else if (
        genreName === "POP"
      ) {

        list =
          [...(moodData.POP || [])];

      }

      else {

        list = [
          ...(moodData.KPOP || []),
          ...(moodData.POP || [])
        ];

      }


      /* 음악을 랜덤하게 섞기 */

      list.sort(
        () => Math.random() - 0.5
      );


      /* 최대 5곡 */

      return list.slice(0, 5);

    }


    /* =========================================
       하트 상태 확인
    ========================================= */

    function isSaved(
      music
    ) {

      return savedSongs.some(
        function(song) {

          return (
            song.title ===
              music.title
            &&
            song.artist ===
              music.artist
          );

        }
      );

    }

          );


          if (
            isSaved(music)
          ) {

            heartButton.textContent =
              "♥";

            heartButton.classList.add(
              "saved"
            );

          }

          else {

            heartButton.textContent =
              "♡";

          }


          heartButton.addEventListener(
            "click",
            function() {

              const existingIndex =
                savedSongs.findIndex(
                  function(song) {

                    return (
                      song.title ===
                        music.title
                      &&
                      song.artist ===
                        music.artist
                    );

                  }
                );


              if (
                existingIndex !== -1
              ) {

                savedSongs.splice(
                  existingIndex,
                  1
                );

              }

              else {

                savedSongs.push({

                  title:
                    music.title,

                  artist:
                    music.artist,

                  url:
                    getYouTubeMusicURL(
                      music
                    )

                });

              }


              localStorage.setItem(
                "sharkPlaylist",
                JSON.stringify(
                  savedSongs
                )
              );


              renderMusicList(
                currentMusicList
              );

            }
          );


          buttonRow.appendChild(
            musicButton
          );

          buttonRow.appendChild(
            heartButton
          );


          card.appendChild(
            top
          );

          card.appendChild(
            buttonRow
          );


          musicList.appendChild(
            card
          );

        }
      );

    }


    /* =========================================
       음악 새로 추천
    ========================================= */

    function recommendMusic() {

      const musicArray =
        getFiveMusic(
          mood || "행복",
          currentGenre
        );

      renderMusicList(
        musicArray
      );

    }


    /* =========================================
       처음 화면
    ========================================= */

    selectedMood.textContent =
      moodEmoji[mood] ||
      "😊";


    moodText.textContent =
      moodMessage[mood] ||
      "너의 기분에 어울리는 노래를 골라봤어.";


    recommendMusic();


    /* =========================================
       장르 버튼
    ========================================= */

    const genreButtons =
      document.querySelectorAll(
        ".genre-button"
      );


    genreButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            genreButtons.forEach(
              function(item) {

                item.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            currentGenre =
              button.dataset.genre;


            recommendMusic();

          }
        );

      }
    );


    /* =========================================
       다른 노래 추천
    ========================================= */

    randomButton.addEventListener(
      "click",
      function() {

        recommendMusic();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


    /* =========================================
       MY MUSIC
    ========================================= */

    document
      .getElementById(
        "playlistButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./playlist.html";

        }
      );


    /* =========================================
       다시 고르기
    ========================================= */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./mood.html";

        }
      );

  </script>

</body>
</html>
