<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }


    /* 전체 페이지 */

    .page {

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;

      flex-direction: column;

      align-items: center;

      background: #dff4f6;
    }


    /* 로고 */

    .logo {

      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;

      font-weight: 600;

      letter-spacing: 3px;

    }


    /* 제목 */

    .result-title {

      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;

      letter-spacing: -1.5px;

    }


    /* 선택한 기분 */

    .selected-mood {

      margin-top: 25px;

      font-size: 64px;

      line-height: 1;

    }


    /* 기분 설명 */

    .mood-text {

      margin-top: 20px;

      text-align: center;

      font-size: 17px;

      line-height: 1.5;

      color: #4b626b;

    }


    /* 음악 카드 */

    .music-card {

      width: 100%;

      max-width: 420px;

      margin-top: 45px;

      padding: 24px;

      border-radius: 26px;

      background: rgba(
        255,
        255,
        255,
        0.8
      );

      box-shadow:
        0 10px 30px
        rgba(
          16,
          32,
          42,
          0.08
        );

    }


    /* TODAY'S PICK */

    .music-label {

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 1px;

      color: #78909a;

    }


    /* 노래 제목 */

    .music-title {

      margin: 10px 0 5px;

      font-size: 22px;

      font-weight: 600;

      color: #10202a;

    }


    /* 아티스트 */

    .music-artist {

      margin: 0;

      font-size: 15px;

      color: #607781;

    }


    /* 버튼 영역 */

    .button-row {

      display: flex;

      gap: 10px;

      width: 100%;

      margin-top: 22px;

    }


    /* YouTube Music */

    .music-button {

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 52px;

      padding: 14px 10px;

      border-radius: 18px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 15px;

      font-weight: 500;

      letter-spacing: 0.3px;

    }


    /* 하트 */

    .heart-button {

      width: 58px;

      min-width: 58px;

      min-height: 52px;

      border: none;

      border-radius: 18px;

      background: #edf7f8;

      color: #10202a;

      font-size: 25px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease;

    }


    .heart-button:active {

      transform: scale(0.88);

    }


    /* 저장된 상태 */

    .heart-button.saved {

      background: #10202a;

      color: #ffffff;

    }


    /* MY MUSIC 버튼 */

    .playlist-button {

      width: 100%;

      max-width: 420px;

      margin-top: 22px;

      padding: 15px 20px;

      border: 1px solid
        rgba(
          16,
          32,
          42,
          0.12
        );

      border-radius: 18px;

      background: rgba(
        255,
        255,
        255,
        0.55
      );

      color: #10202a;

      font-size: 15px;

      font-weight: 500;

      letter-spacing: 0.3px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease;

    }


    .playlist-button:active {

      transform:
        scale(0.97);

    }


    /* 다시 고르기 */

    .back-button {

      margin-top: 20px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;

    }


    @media (max-width: 380px) {

      .page {

        padding-left: 18px;

        padding-right: 18px;

      }

      .logo {

        margin-bottom: 45px;

      }

      .selected-mood {

        font-size: 56px;

      }

      .music-card {

        padding: 20px;

      }

      .music-title {

        font-size: 20px;

      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- 로고 -->

    <div class="logo">
      SHARK
    </div>


    <!-- 제목 -->

    <h1 class="result-title">
      오늘은 이런 노래 어때?
    </h1>


    <!-- 선택한 기분 -->

    <div
      class="selected-mood"
      id="selectedMood"
    >
      😊
    </div>


    <!-- 기분 설명 -->

    <p
      class="mood-text"
      id="moodText"
    >
      행복한 기분에 어울리는 노래를
      골라봤어.
    </p>


    <!-- 음악 카드 -->

    <section class="music-card">

      <div class="music-label">
        TODAY'S PICK
      </div>


      <h2
        class="music-title"
        id="musicTitle"
      >
        기분 좋은 하루
      </h2>


      <p
        class="music-artist"
        id="musicArtist"
      >
        SHARK 추천 음악
      </p>


      <!-- 음악 버튼 -->

      <div class="button-row">

        <a
          href="#"
          class="music-button"
          id="musicButton"
          target="_blank"
          rel="noopener"
        >
          ▶ YouTube Music
        </a>


        <button
          class="heart-button"
          id="heartButton"
          type="button"
          aria-label="노래 저장"
        >
          🤍
        </button>

      </div>

    </section>


    <!-- MY MUSIC -->

    <button
      class="playlist-button"
      id="playlistButton"
      type="button"
    >
      ♡ MY MUSIC
    </button>


    <!-- 다시 고르기 -->

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 고르기
    </button>


  </main>


  <script>


    /* =========================================
       URL에서 기분 가져오기
    ========================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mood =
      params.get("mood");


    /* =========================================
       화면 요소
    ========================================= */

    const selectedMood =
      document.getElementById(
        "selectedMood"
      );


    const moodText =
      document.getElementById(
        "moodText"
      );


    const musicTitle =
      document.getElementById(
        "musicTitle"
      );


    const musicArtist =
      document.getElementById(
        "musicArtist"
      );


    const musicButton =
      document.getElementById(
        "musicButton"
      );


    const heartButton =
      document.getElementById(
        "heartButton"
      );


    /* =========================================
       기분별 이모지
    ========================================= */

    const moodEmoji = {

      "행복": "😊",
      "사랑": "💗",
      "슬픔": "😢",
      "화남": "😡",
      "피곤": "😴",
      "위로": "🥺",
      "신남": "🤩",
      "SHARK": "🦈"

    };


    /* =========================================
       기분별 문구
    ========================================= */

    const moodMessage = {

      "행복":
        "행복한 기분에 어울리는 노래를 골라봤어.",

      "사랑":
        "설레는 기분에 어울리는 노래를 골라봤어.",

      "슬픔":
        "조금 지친 마음을 달래줄 노래를 골라봤어.",

      "화남":
        "답답한 기분을 날려줄 노래를 골라봤어.",

      "피곤":
        "편하게 들을 수 있는 노래를 골라봤어.",

      "위로":
        "오늘 너에게 필요한 위로의 노래를 골라봤어.",

      "신남":
        "지금 기분을 더 신나게 만들어줄 노래야.",

      "SHARK":
        "바다를 떠올리게 하는 음악을 골라봤어."

    };


    /* =========================================
       기분별 추천곡
    ========================================= */

    const musicData = {

      "행복": [

        {
          title: "Sunday Morning",
          artist: "Maroon 5"
        },

        {
          title: "Walking On Sunshine",
          artist: "Katrina & The Waves"
        },

        {
          title: "Good Time",
          artist: "Owl City & Carly Rae Jepsen"
        },

        {
          title: "Dynamite",
          artist: "BTS"
        },

        {
          title: "Super Shy",
          artist: "NewJeans"
        }

      ],


      "사랑": [

        {
          title: "Love wins all",
          artist: "IU"
        },

        {
          title: "Perfect",
          artist: "Ed Sheeran"
        },

        {
          title: "Until I Found You",
          artist: "Stephen Sanchez"
        },

        {
          title: "Ditto",
          artist: "NewJeans"
        },

        {
          title: "I AM",
          artist: "IVE"
        }

      ],


      "슬픔": [

        {
          title: "Through the Night",
          artist: "IU"
        },

        {
          title: "Let Her Go",
          artist: "Passenger"
        },

        {
          title: "drivers license",
          artist: "Olivia Rodrigo"
        },

        {
          title: "Love Poem",
          artist: "IU"
        },

        {
          title: "Beautiful Goodbye",
          artist: "Chen"
        }

      ],


      "화남": [

        {
          title: "Believer",
          artist: "Imagine Dragons"
        },

        {
          title: "Natural",
          artist: "Imagine Dragons"
        },

        {
          title: "Thunder",
          artist: "Imagine Dragons"
        },

        {
          title: "God's Menu",
          artist: "Stray Kids"
        },

        {
          title: "MANIAC",
          artist: "Stray Kids"
        }

      ],


      "피곤": [

        {
          title: "golden hour",
          artist: "JVKE"
        },

        {
          title: "Until I Found You",
          artist: "Stephen Sanchez"
        },

        {
          title: "comethru",
          artist: "Jeremy Zucker"
        },

        {
          title: "Love Me Like You Do",
          artist: "Ellie Goulding"
        },

        {
          title: "Ditto",
          artist: "NewJeans"
        }

      ],


      "위로": [

        {
          title: "밤편지",
          artist: "IU"
        },

        {
          title: "That's Hilarious",
          artist: "Charlie Puth"
        },

        {
          title: "Eight",
          artist: "IU"
        },

        {
          title: "You Are My Everything",
          artist: "Gummy"
        },

        {
          title: "To My Youth",
          artist: "BOL4"
        }

      ],


      "신남": [

        {
          title: "APT.",
          artist: "ROSÉ & Bruno Mars"
        },

        {
          title: "Dynamite",
          artist: "BTS"
        },

        {
          title: "How Sweet",
          artist: "NewJeans"
        },

        {
          title: "After LIKE",
          artist: "IVE"
        },

        {
          title: "Queencard",
          artist: "(G)I-DLE"
        }

      ],


      "SHARK": [

        {
          title: "Ocean Eyes",
          artist: "Billie Eilish"
        },

        {
          title: "Ocean",
          artist: "Martin Garrix feat. Khalid"
        },

        {
          title: "Waves",
          artist: "Dean Lewis"
        },

        {
          title: "Ocean Drive",
          artist: "Duke Dumont"
        },

        {
          title: "A Drop In The Ocean",
          artist: "Ron Pope"
        }

      ]

    };


    /* =========================================
       저장된 음악
    ========================================= */

    let savedSongs =
      JSON.parse(
        localStorage.getItem(
          "sharkPlaylist"
        ) || "[]"
      );


    let currentMusic = null;


    /* =========================================
       랜덤 음악
    ========================================= */

    function getRandomMusic(
      moodName
    ) {

      const list =
        musicData[moodName];


      if (
        !list ||
        list.length === 0
      ) {

        return {
          title: "Ocean",
          artist: "SHARK 추천 음악"
        };

      }


      const randomIndex =
        Math.floor(
          Math.random() *
          list.length
        );


      return list[randomIndex];

    }


    /* =========================================
       YouTube Music 검색
    ========================================= */

    function getYouTubeMusicURL(
      music
    ) {

      const searchText =
        music.title +
        " " +
        music.artist;


      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(
          searchText
        )
      );

    }


    /* =========================================
       하트 상태
    ========================================= */

    function updateHeart() {

      if (!currentMusic) {
        return;
      }


      const isSaved =
        savedSongs.some(
          function(song) {

            return (
              song.title ===
                currentMusic.title
              &&
              song.artist ===
                currentMusic.artist
            );

          }
        );


      if (isSaved) {

        heartButton.textContent =
          "❤️";

        heartButton.classList.add(
          "saved"
        );

      } else {

        heartButton.textContent =
          "🤍";

        heartButton.classList.remove(
          "saved"
        );

      }

    }


    /* =========================================
       음악 표시
    ========================================= */

    function showMusic(
      music
    ) {

      currentMusic =
        music;


      musicTitle.textContent =
        music.title;


      musicArtist.textContent =
        music.artist;


      musicButton.href =
        getYouTubeMusicURL(
          music
        );


      updateHeart();

    }


    /* =========================================
       현재 기분 적용
    ========================================= */

    if (mood) {

      selectedMood.textContent =
        moodEmoji[mood] ||
        "😊";


      moodText.textContent =
        moodMessage[mood] ||
        "너의 기분에 어울리는 노래를 골라봤어.";


      showMusic(
        getRandomMusic(
          mood
        )
      );

    } else {

      showMusic(
        getRandomMusic(
          "행복"
        )
      );

    }


    /* =========================================
       ❤️ 저장 / 삭제
    ========================================= */

    heartButton.addEventListener(
      "click",
      function() {

        if (!currentMusic) {
          return;
        }


        const existingIndex =
          savedSongs.findIndex(
            function(song) {

              return (
                song.title ===
                  currentMusic.title
                &&
                song.artist ===
                  currentMusic.artist
              );

            }
          );


        if (
          existingIndex !== -1
        ) {

          savedSongs.splice(
            existingIndex,
            1
          );

        } else {

          savedSongs.push({

            title:
              currentMusic.title,

            artist:
              currentMusic.artist,

            url:
              getYouTubeMusicURL(
                currentMusic
              )

          });

        }


        localStorage.setItem(
          "sharkPlaylist",
          JSON.stringify(
            savedSongs
          )
        );


        updateHeart();

      }
    );


    /* =========================================
       MY MUSIC
    ========================================= */

    document
      .getElementById(
        "playlistButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./playlist.html";

        }
      );


    /* =========================================
       다시 고르기
    ========================================= */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./mood.html";

        }
      );


  </script>

</body>
</html>
