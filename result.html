<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }

    .page {

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;

      flex-direction: column;

      align-items: center;

      background: #dff4f6;
    }


    /* 상단 */

    .logo {

      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;

      font-weight: 600;

      letter-spacing: 3px;

    }


    /* 제목 */

    .result-title {

      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;

      letter-spacing: -1.5px;

    }


    /* 선택한 기분 */

    .selected-mood {

      margin-top: 25px;

      font-size: 64px;

      line-height: 1;

    }


    .mood-text {

      margin-top: 20px;

      text-align: center;

      font-size: 17px;

      line-height: 1.5;

      color: #4b626b;

    }


    /* 음악 카드 */

    .music-card {

      width: 100%;

      max-width: 420px;

      margin-top: 45px;

      padding: 24px;

      border-radius: 26px;

      background: rgba(
        255,
        255,
        255,
        0.8
      );

      box-shadow:
        0 10px 30px
        rgba(
          16,
          32,
          42,
          0.08
        );

    }


    .music-label {

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 1px;

      color: #78909a;

    }


    .music-title {

      margin: 10px 0 5px;

      font-size: 22px;

      font-weight: 600;

      color: #10202a;

    }


    .music-artist {

      margin: 0;

      font-size: 15px;

      color: #607781;

    }


    /* 듣기 버튼 */

    .music-button {

      display: block;

      width: 100%;

      margin-top: 22px;

      padding: 16px 20px;

      border-radius: 18px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 16px;

      font-weight: 500;

      letter-spacing: 0.5px;

    }


    /* 다시 고르기 */

    .back-button {

      margin-top: 25px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;

    }


    @media (max-width: 380px) {

      .page {

        padding-left: 18px;
        padding-right: 18px;

      }

      .logo {

        margin-bottom: 45px;

      }

      .selected-mood {

        font-size: 56px;

      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- 로고 -->

    <div class="logo">
      SHARK
    </div>


    <!-- 제목 -->

    <h1 class="result-title">
      오늘은 이런 노래 어때?
    </h1>


    <!-- 선택한 이모지 -->

    <div
      class="selected-mood"
      id="selectedMood"
    >
      😊
    </div>


    <!-- 선택한 기분 설명 -->

    <p
      class="mood-text"
      id="moodText"
    >
      행복한 기분에 어울리는 노래를
      골라봤어.
    </p>


    <!-- 추천 음악 -->

    <section class="music-card">

      <div class="music-label">
        TODAY'S PICK
      </div>


      <h2
        class="music-title"
        id="musicTitle"
      >
        기분 좋은 하루
      </h2>


      <p
        class="music-artist"
        id="musicArtist"
      >
        SHARK 추천 음악
      </p>


      <a
        href="#"
        class="music-button"
        id="musicButton"
      >
        ▶ 노래 듣기
      </a>

    </section>


    <!-- 다시 선택 -->

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 고르기
    </button>


  </main>


  <script>

    /*
      mood.html에서 전달받은 기분
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mood =
      params.get("mood");


    const selectedMood =
      document.getElementById(
        "selectedMood"
      );


    const moodText =
      document.getElementById(
        "moodText"
      );


    const musicTitle =
      document.getElementById(
        "musicTitle"
      );


    const musicArtist =
      document.getElementById(
        "musicArtist"
      );


    /*
      기분별 이모지
    */

    const moodEmoji = {

      "행복": "😊",

      "사랑": "💗",

      "슬픔": "😢",

      "화남": "😡",

      "피곤": "😴",

      "위로": "🥺",

      "신남": "🤩",

      "SHARK": "🦈"

    };


    /*
      기분별 문구
    */

    const moodMessage = {

      "행복":
        "행복한 기분에 어울리는 노래를 골라봤어.",

      "사랑":
        "설레는 기분에 어울리는 노래를 골라봤어.",

      "슬픔":
        "조금 지친 마음을 달래줄 노래를 골라봤어.",

      "화남":
        "답답한 기분을 날려줄 노래를 골라봤어.",

      "피곤":
        "편하게 들을 수 있는 노래를 골라봤어.",

      "위로":
        "오늘 너에게 필요한 위로의 노래를 골라봤어.",

      "신남":
        "지금 기분을 더 신나게 만들어줄 노래야.",

      "SHARK":
        "바다와 비가 떠오르는 음악을 골라봤어."

    };


    /*
      기분별 임시 추천곡
    */

    const musicData = {

      "행복": {
        title: "기분 좋은 하루",
        artist: "SHARK 추천 음악"
      },

      "사랑": {
        title: "설레는 순간",
        artist: "SHARK 추천 음악"
      },

      "슬픔": {
        title: "조용한 밤",
        artist: "SHARK 추천 음악"
      },

      "화남": {
        title: "Turn It Up",
        artist: "SHARK 추천 음악"
      },

      "피곤": {
        title: "Slow Down",
        artist: "SHARK 추천 음악"
      },

      "위로": {
        title: "괜찮아",
        artist: "SHARK 추천 음악"
      },

      "신남": {
        title: "Let's Go",
        artist: "SHARK 추천 음악"
      },

      "SHARK": {
        title: "Ocean Rain",
        artist: "바다와 비가 어울리는 음악"
      }

    };


    /*
      선택한 기분이 있을 경우
    */

    if (mood) {

      selectedMood.textContent =
        moodEmoji[mood] || "😊";


      moodText.textContent =
        moodMessage[mood] ||
        "너의 기분에 어울리는 노래를 골라봤어.";


      const music =
        musicData[mood];


      if (music) {

        musicTitle.textContent =
          music.title;

        musicArtist.textContent =
          music.artist;

      }

    }


    /*
      다시 고르기
    */

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        function () {

          window.location.href =
            "./mood.html";

        }
      );

  </script>

</body>
</html>
