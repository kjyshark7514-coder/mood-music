    /* =========================================

    ========================================= */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(28px + env(safe-area-inset-top))
        20px
        calc(40px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(44, 145, 171, 0.22),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #071a24 0%,
          #06141d 48%,
          #041017 100%
        );
    }


    .page::before {
      content: "";

      position: absolute;

      width: 520px;
      height: 520px;

      top: 180px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(30, 166, 193, 0.10),
          transparent 68%
        );

      pointer-events: none;
    }


    /* =========================================
       로고
    ========================================= */

    .logo {
      position: relative;
      z-index: 1;

      margin-bottom: 52px;

      color: #ffffff;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: 5px;
    }


    .logo::after {
      content: "";

      display: block;

      width: 22px;
      height: 2px;

      margin: 8px auto 0;

      border-radius: 2px;

      background: #55d5e8;
    }


    /* =========================================
       상단 작은 문구
    ========================================= */

    .eyebrow {

      z-index: 1;

      font-weight: 600;

      text-transform: uppercase;
    }


    /* =========================================
       제목
    ========================================= */

    .result-title {
      position: relative;
      z-index: 1;

      margin: 0;

      text-align: center;

      color: #ffffff;

    }


    /* =========================================

    ========================================= */

    .selected-mood-wrap {
      position: relative;
      z-index: 1;

      width: 86px;
      height: 86px;

      margin-top: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:

      border:

    }

      z-index: 1;

      font-size: 14px;

      line-height: 1.6;
    }

       장르 영역
    ========================================= */

      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 440px;

      margin-top: 34px;
    }


    .genre-title {
      margin-bottom: 11px;

      color: #7898a2;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }


    .genre-row {
      width: 100%;

      display: flex;

      padding: 4px;

      gap: 4px;

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.055);

      border:
        1px solid
        rgba(255, 255, 255, 0.07);
    }

      flex: 1;

      border: none;

      border-radius: 13px;

      background: transparent;

      color: #7f9ca5;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }


    .genre-button.active {
      background: #eafcff;

      color: #09202a;

      box-shadow:

    .music-card::before {

      left: 0;

            title: "Island",
            artist: "WINNER"
          },
          {
            title: "Summer Hate",
            artist: "Zico"
          },
          {
            title: "Blue",
            artist: "BIGBANG"
          }
        ],

        POP: [
          {
            title: "Ocean Eyes",
            artist: "Billie Eilish"
          },
          {
            title: "Ocean",
            artist: "Martin Garrix feat. Khalid"
          },
          {
            title: "Waves",
            artist: "Dean Lewis"
          },
          {
            title: "Ocean Drive",
            artist: "Duke Dumont"
          },
          {
            title: "A Drop In The Ocean",
            artist: "Ron Pope"
          }
        ]

      }

    };


    /* =========================================
       저장된 음악
    ========================================= */

    let savedSongs =
      JSON.parse(
        localStorage.getItem(
          "sharkPlaylist"
        ) || "[]"
      );


    /* =========================================
       YouTube Music 주소
    ========================================= */

    function getMusicURL(music) {

      const searchText =
        music.title +
        " " +
        music.artist;

      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(searchText)
      );

    }


    /* =========================================
       5곡 가져오기
    ========================================= */

    function getFiveMusic(
      moodName,
      genreName
    ) {

      const moodData =
        musicData[moodName];

      if (!moodData) {
        return [];
      }


      let list = [];


      if (
        genreName === "KPOP"
      ) {

        list =
          [...(moodData.KPOP || [])];

      }

      else if (
        genreName === "POP"
      ) {

        list =
          [...(moodData.POP || [])];

      }

      else {

        list = [
          ...(moodData.KPOP || []),
          ...(moodData.POP || [])
        ];

      }


      list.sort(
        () => Math.random() - 0.5
      );


      return list.slice(0, 5);

    }


    /* =========================================
       하트 상태 확인
    ========================================= */

    function isSaved(music) {

      return savedSongs.some(
        function(song) {

          return (
            song.title === music.title &&
            song.artist === music.artist
          );

        }
      );

    }


    /* =========================================
       음악 목록 표시
    ========================================= */

    function renderMusicList(
      musicArray
    ) {

      currentMusicList =
        musicArray;

      musicList.innerHTML = "";


      musicArray.forEach(
        function(music, index) {

          const card =
            document.createElement(
              "article"
            );

          card.className =
            "music-card";


          const top =
            document.createElement(
              "div"
            );

          top.className =
            "music-top";


          const number =
            document.createElement(
              "div"
            );

          number.className =
            "music-number";

          number.textContent =
            String(index + 1).padStart(2, "0");


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "music-info";


          const title =
            document.createElement(
              "h2"
            );

          title.className =
            "music-title";

          title.textContent =
            music.title;


          const artist =
            document.createElement(
              "p"
            );

          artist.className =
            "music-artist";

          artist.textContent =
            music.artist;


          info.appendChild(title);
          info.appendChild(artist);


          top.appendChild(number);
          top.appendChild(info);


          const buttonRow =
            document.createElement(
              "div"
            );

          buttonRow.className =
            "button-row";


          /* =========================================
             YouTube Music 버튼
          ========================================= */

          const musicButton =
            document.createElement(
              "a"
            );

          musicButton.className =
            "music-button";

          musicButton.href =
            getMusicURL(music);

          musicButton.target =
            "_blank";

          musicButton.rel =
            "noopener noreferrer";

          musicButton.textContent =
            "YouTube Music에서 듣기";


          /* =========================================
             하트 버튼
          ========================================= */

          const heartButton =
            document.createElement(
              "button"
            );

          heartButton.className =
            "heart-button";

          heartButton.type =
            "button";

          heartButton.setAttribute(
            "aria-label",
            "노래 저장"
          );


          if (
            isSaved(music)
          ) {

            heartButton.textContent =
              "♥";

            heartButton.classList.add(
              "saved"
            );

          }

          else {

            heartButton.textContent =
              "♡";

          }


          heartButton.addEventListener(
            "click",
            function() {

              const existingIndex =
                savedSongs.findIndex(
                  function(song) {

                    return (
                      song.title === music.title &&
                      song.artist === music.artist
                    );

                  }
                );


              if (
                existingIndex !== -1
              ) {

                savedSongs.splice(
                  existingIndex,
                  1
                );

              }

              else {

                savedSongs.push({

                  title:
                    music.title,

                  artist:
                    music.artist,

                  url:
                    getMusicURL(music)

                });

              }


              localStorage.setItem(
                "sharkPlaylist",
                JSON.stringify(savedSongs)
              );


              renderMusicList(
                currentMusicList
              );

            }
          );


          buttonRow.appendChild(
            musicButton
          );

          buttonRow.appendChild(
            heartButton
          );


          card.appendChild(
            top
          );

          card.appendChild(
            buttonRow
          );


          musicList.appendChild(
            card
          );

        }
      );

    }


    /* =========================================
       음악 새로 추천
    ========================================= */

    function recommendMusic() {

      const musicArray =
        getFiveMusic(
          mood || "행복",
          currentGenre
        );

      renderMusicList(
        musicArray
      );

    }


    /* =========================================
       처음 화면
    ========================================= */

    selectedMood.textContent =
      moodEmoji[mood] ||
      "😊";


    moodText.textContent =
      moodMessage[mood] ||
      "너의 기분에 어울리는 노래를 골라봤어.";


    recommendMusic();


    /* =========================================
       장르 버튼
    ========================================= */

    const genreButtons =
      document.querySelectorAll(
        ".genre-button"
      );


    genreButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            genreButtons.forEach(
              function(item) {

                item.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            currentGenre =
              button.dataset.genre;


            recommendMusic();

          }
        );

      }
    );


    /* =========================================
       다른 노래 추천
    ========================================= */

    randomButton.addEventListener(
      "click",
      function() {

        recommendMusic();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


    /* =========================================
       MY MUSIC
    ========================================= */

    document
      .getElementById(
        "playlistButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./playlist.html";

        }
      );


    /* =========================================
       다시 고르기
    ========================================= */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./mood.html";

        }
      );

  </script>

</body>
</html>
