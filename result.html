<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #dff4f6;
    }


    /* 로고 */

    .logo {
      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
    }


    /* 제목 */

    .result-title {
      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;
      letter-spacing: -1.5px;
    }


    /* 선택한 기분 */

    .selected-mood {
      margin-top: 25px;

      font-size: 64px;
      line-height: 1;
    }


    /* 설명 */

    .mood-text {
      margin-top: 20px;

      text-align: center;

      font-size: 17px;
      line-height: 1.5;

      color: #4b626b;
    }


    /* 음악 스타일 선택 */

    .genre-title {
      width: 100%;
      max-width: 420px;

      margin: 35px 0 14px;

      text-align: center;

      font-size: 16px;
      font-weight: 600;

      color: #526b74;
    }


    .genre-buttons {
      width: 100%;
      max-width: 420px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }


    .genre-button {
      padding: 15px 10px;

      border: none;
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.7);

      color: #526b74;

      font-size: 16px;
      font-weight: 500;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .genre-button.selected {
      background: #10202a;

      color: #ffffff;

      box-shadow:
        0 8px 20px
        rgba(16, 32, 42, 0.12);
    }


    .genre-button:active {
      transform: scale(0.95);
    }


    /* 음악 목록 */

    .music-list {
      width: 100%;
      max-width: 420px;

      margin-top: 28px;

      display: flex;
      flex-direction: column;

      gap: 14px;
    }


    /* 음악 카드 */

    .music-card {
      width: 100%;

      padding: 20px;

      border-radius: 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.82
        );

      box-shadow:
        0 10px 30px
        rgba(
          16,
          32,
          42,
          0.08
        );

      animation:
        cardAppear 0.3s ease;
    }


    @keyframes cardAppear {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    .music-label {
      font-size: 11px;

      font-weight: 600;

      letter-spacing: 1px;

      color: #78909a;
    }


    .music-title {
      margin: 8px 0 5px;

      font-size: 21px;

      font-weight: 600;

      color: #10202a;
    }


    .music-artist {
      margin: 0;

      font-size: 14px;

      color: #607781;
    }


    /* 듣기 버튼 */

    .music-button {
      display: block;

      width: 100%;

      margin-top: 16px;

      padding: 14px 18px;

      border-radius: 16px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 15px;

      font-weight: 500;

      letter-spacing: 0.3px;

      cursor: pointer;
    }


    /* 다시 고르기 */

    .back-button {
      margin-top: 25px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;
    }


    @media (max-width: 380px) {

      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .logo {
        margin-bottom: 45px;
      }

      .selected-mood {
        font-size: 56px;
      }

      .music-title {
        font-size: 19px;
      }

    }

  </style>
</head>

    </div>


    <div class="genre-buttons">

      <button
        class="genre-button selected"
        id="kpopButton"
        type="button"
      >
        🇰🇷 K-POP
      </button>


      <button
        class="genre-button"
        id="popButton"

      >
        🌎 POP

    </div>


    <!-- 음악 목록 -->

    <section
      class="music-list"
      id="musicList"

    <!-- 다시 고르기 -->

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 고르기
    </button>


  </main>

    /*
      초기 화면
    */

    selectedMood.textContent =
      moodEmoji[mood] || "😊";


    moodText.textContent =
      moodMessage[mood] ||
      "너의 기분에 어울리는 노래를 골라봤어.";


    /*
      음악 표시 함수
    */

    function showMusic() {

      musicList.innerHTML = "";


      let recommendations;


      if (currentGenre === "KPOP") {

        recommendations =
          kpopMusic[mood] ||
          kpopMusic["행복"];

      } else {

        recommendations =
          popMusic[mood] ||
          popMusic["행복"];

      }


      recommendations.forEach(
        function (music, index) {

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "music-card";


          card.innerHTML = `

            <div class="music-label">

              ${
                index === 0
                  ? "TODAY'S PICK"
                  : "RECOMMENDED"
              }

            </div>


            <h2 class="music-title">
              ${music.title}
            </h2>


            <p class="music-artist">
              ${music.artist}
            </p>


            <a
              href="#"
              class="music-button"
              data-title="${music.title}"
              data-artist="${music.artist}"
            >
              ▶ 노래 듣기
            </a>

          `;


          musicList.appendChild(
            card
          );

        }
      );

    }

      처음에는 K-POP
    */

      K-POP 버튼
    */

        kpopButton.classList.add(

        );

        popButton.classList.remove(
          "selected"
        );


        showMusic();

      }
    );

      POP 버튼
    */

      "click",
      function () {

        currentGenre = "POP";


        popButton.classList.add(
          "selected"
        );

        kpopButton.classList.remove(
          "selected"
        );


        showMusic();

      }
    );

      YouTube Music 연결
    */

      function (event) {

        const button =
          event.target.closest(
            ".music-button"
          );


        if (!button) {
          return;
        }


        event.preventDefault();


        const title =
          button.dataset.title;


        const artist =
          button.dataset.artist;


        const query =
          title +
          " " +
          artist;


        const youtubeMusicURL =
          "https://music.youtube.com/search?q=" +
          encodeURIComponent(
            query
          );


        window.open(
          youtubeMusicURL,
          "_blank"
        );

    );
