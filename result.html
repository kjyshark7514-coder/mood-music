<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }

    .page {

      width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #dff4f6;
    }


    /* 상단 */

    .logo {

      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;

      font-weight: 600;

      letter-spacing: 3px;

    }


    /* 제목 */

    .result-title {

      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;

      letter-spacing: -1.5px;

    }


    /* 선택한 기분 */

    .selected-mood {

      margin-top: 25px;

      font-size: 64px;

      line-height: 1;

    }


    .mood-text {

      margin-top: 20px;

      text-align: center;

      font-size: 17px;

      line-height: 1.5;

      color: #4b626b;

    }


    /* 추천 음악 영역 */

    .music-list {

      width: 100%;

      max-width: 420px;

      margin-top: 40px;

      display: flex;

      flex-direction: column;

      gap: 14px;

    }


    /* 음악 카드 */

    .music-card {

      width: 100%;

      padding: 20px;

      border-radius: 24px;

      background: rgba(
        255,
        255,
        255,
        0.8
      );

      box-shadow:
        0 10px 30px
        rgba(
          16,
          32,
          42,
          0.08
        );

    }


    .music-label {

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 1px;

      color: #78909a;

    }


    .music-title {

      margin: 8px 0 5px;

      font-size: 21px;

      font-weight: 600;

      color: #10202a;

    }


    .music-artist {

      margin: 0;

      font-size: 14px;

      color: #607781;

    }


    /* 듣기 버튼 */

    .music-button {

      display: block;

      width: 100%;

      margin-top: 16px;

      padding: 14px 18px;

      border-radius: 16px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 15px;

      font-weight: 500;

      letter-spacing: 0.3px;

      cursor: pointer;

    }


    /* 다시 고르기 */

    .back-button {

      margin-top: 25px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;

    }


    @media (max-width: 380px) {

      .page {

        padding-left: 18px;
        padding-right: 18px;

      }

      .logo {

        margin-bottom: 45px;

      }

      .selected-mood {

        font-size: 56px;

      }

      .music-title {

        font-size: 19px;

      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- 로고 -->

    <div class="logo">
      SHARK
    </div>


    <!-- 제목 -->

    <h1 class="result-title">
      오늘은 이런 노래 어때?
    </h1>


    <!-- 선택한 기분 -->

    <div
      class="selected-mood"
      id="selectedMood"
    >
      😊
    </div>


    <!-- 기분 설명 -->

    <p
      class="mood-text"
      id="moodText"
    >
      행복한 기분에 어울리는 노래를
      골라봤어.
    </p>


    <!-- 추천 음악 -->

    <section
      class="music-list"
      id="musicList"
    >
    </section>


    <!-- 다시 고르기 -->

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 고르기
    </button>


  </main>


  <script>

    /*
      mood.html에서 전달받은 기분
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mood =
      params.get("mood");


    const selectedMood =
      document.getElementById(
        "selectedMood"
      );


    const moodText =
      document.getElementById(
        "moodText"
      );


    const musicList =
      document.getElementById(
        "musicList"
      );


    /*
      기분별 이모지
    */

    const moodEmoji = {

      "행복": "😊",

      "사랑": "💗",

      "슬픔": "😢",

      "화남": "😡",

      "피곤": "😴",

      "위로": "🥺",

      "신남": "🤩",

      "SHARK": "🦈"

    };


    /*
      기분별 문구
    */

    const moodMessage = {

      "행복":
        "행복한 기분에 어울리는 노래를 골라봤어.",

      "사랑":
        "설레는 기분에 어울리는 노래를 골라봤어.",

      "슬픔":
        "조금 지친 마음을 달래줄 노래를 골라봤어.",

      "화남":
        "답답한 기분을 날려줄 노래를 골라봤어.",

      "피곤":
        "편하게 들을 수 있는 노래를 골라봤어.",

      "위로":
        "오늘 너에게 필요한 위로의 노래를 골라봤어.",

      "신남":
        "지금 기분을 더 신나게 만들어줄 노래야.",

      "SHARK":
        "바다와 비가 떠오르는 음악을 골라봤어."

    };


    /*
      기분별 추천 음악 5개
    */

    const musicData = {

      "행복": [

        {
          title: "Happy Day",
          artist: "Happy Mood",
          query: "happy mood music"
        },

        {
          title: "Good Vibes",
          artist: "Upbeat Music",
          query: "good vibes happy music"
        },

        {
          title: "Sunny Day",
          artist: "Feel Good Music",
          query: "sunny day feel good music"
        },

        {
          title: "Feel Good",
          artist: "Positive Music",
          query: "feel good music"
        },

        {
          title: "Bright Morning",
          artist: "Happy Music",
          query: "happy morning music"
        }

      ],


      "사랑": [

        {
          title: "Romantic",
          artist: "Love Songs",
          query: "romantic love songs"
        },

        {
          title: "Love Story",
          artist: "Romantic Music",
          query: "romantic love music"
        },

        {
          title: "Sweet Love",
          artist: "Love Songs",
          query: "sweet love songs"
        },

        {
          title: "Falling in Love",
          artist: "Romantic Music",
          query: "falling in love songs"
        },

        {
          title: "Late Night Love",
          artist: "Romantic Songs",
          query: "late night romantic songs"
        }

      ],


      "슬픔": [

        {
          title: "Sad Night",
          artist: "Emotional Music",
          query: "sad emotional music"
        },

        {
          title: "Quiet Night",
          artist: "Sad Music",
          query: "sad quiet night music"
        },

        {
          title: "Lonely",
          artist: "Emotional Songs",
          query: "emotional sad songs"
        },

        {
          title: "Rainy Night",
          artist: "Sad Mood Music",
          query: "rainy night sad music"
        },

        {
          title: "Deep Emotion",
          artist: "Emotional Music",
          query: "deep emotional music"
        }

      ],


      "화남": [

        {
          title: "Power",
          artist: "Rock Music",
          query: "powerful rock music"
        },

        {
          title: "Turn It Up",
          artist: "Rock",
          query: "hard rock music"
        },

        {
          title: "Break Free",
          artist: "Powerful Rock",
          query: "powerful rock songs"
        },

        {
          title: "Energy",
          artist: "Rock Music",
          query: "high energy rock music"
        },

        {
          title: "Let It Out",
          artist: "Rock",
          query: "angry rock music"
        }

      ],


      "피곤": [

        {
          title: "Slow Down",
          artist: "Relaxing Music",
          query: "relaxing sleep music"
        },

        {
          title: "Deep Sleep",
          artist: "Sleep Music",
          query: "deep sleep music"
        },

        {
          title: "Calm Night",
          artist: "Relaxing Music",
          query: "calm relaxing night music"
        },

        {
          title: "Soft Dreams",
          artist: "Sleep Music",
          query: "soft sleep music"
        },

        {
          title: "Peaceful",
          artist: "Relaxing Music",
          query: "peaceful relaxing music"
        }

      ],


      "위로": [

        {
          title: "Comfort",
          artist: "Emotional Music",
          query: "comforting emotional music"
        },

        {
          title: "It's Okay",
          artist: "Comfort Music",
          query: "comforting songs"
        },

        {
          title: "Warm Heart",
          artist: "Emotional Songs",
          query: "warm emotional music"
        },

        {
          title: "You Are Not Alone",
          artist: "Comfort Music",
          query: "you are not alone comforting songs"
        },

        {
          title: "Healing",
          artist: "Healing Music",
          query: "healing emotional music"
        }

      ],


      "신남": [

        {
          title: "Let's Go",
          artist: "Upbeat Music",
          query: "upbeat happy music"
        },

        {
          title: "Good Vibes",
          artist: "Upbeat Songs",
          query: "upbeat music good vibes"
        },

        {
          title: "Party Time",
          artist: "Happy Music",
          query: "upbeat party music"
        },

        {
          title: "Energy Up",
          artist: "Upbeat Music",
          query: "high energy upbeat music"
        },

        {
          title: "Feel Alive",
          artist: "Happy Music",
          query: "feel alive upbeat music"
        }

      ],


      "SHARK": [

        {
          title: "Ocean",
          artist: "Ocean & Rain",
          query: "ocean rain music"
        },

        {
          title: "Ocean Waves",
          artist: "Ocean Sounds",
          query: "ocean waves music"
        },

        {
          title: "Deep Blue",
          artist: "Deep Ocean",
          query: "deep ocean music"
        },

        {
          title: "Rainy Ocean",
          artist: "Ocean Rain",
          query: "ocean rain sounds"
        },

        {
          title: "Sea Breeze",
          artist: "Calm Ocean",
          query: "calm ocean music"
        }

      ]

    };


    /*
      추천 음악 카드 생성
    */

    if (mood) {

      selectedMood.textContent =
        moodEmoji[mood] || "😊";


      moodText.textContent =
        moodMessage[mood] ||
        "너의 기분에 어울리는 노래를 골라봤어.";


      const recommendations =
        musicData[mood];


      if (recommendations) {

        recommendations.forEach(
          function (music, index) {

            const card =
              document.createElement(
                "article"
              );


            card.className =
              "music-card";


            card.innerHTML = `

              <div class="music-label">
                ${index === 0
                  ? "TODAY'S PICK"
                  : "RECOMMENDED"}
              </div>

              <h2 class="music-title">
                ${music.title}
              </h2>

              <p class="music-artist">
                ${music.artist}
              </p>

              <a
                href="#"
                class="music-button"
                data-query="${music.query}"
              >
                ▶ 노래 듣기
              </a>

            `;


            musicList.appendChild(
              card
            );

          }
        );

      }

    }


    /*
      YouTube Music 연결
    */

    musicList.addEventListener(
      "click",
      function (event) {

        const button =
          event.target.closest(
            ".music-button"
          );


        if (!button) {
          return;
        }


        event.preventDefault();


        const query =
          button.dataset.query;


        if (!query) {
          return;
        }


        const youtubeMusicURL =
          "https://music.youtube.com/search?q=" +
          encodeURIComponent(
            query
          );


        window.open(
          youtubeMusicURL,
          "_blank"
        );

      }
    );


    /*
      다시 고르기
    */

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        function () {

          window.location.href =
            "./mood.html";

        }
      );

  </script>

</body>
</html>
