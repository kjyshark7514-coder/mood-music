<!DOCTYPE html>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }


    /* 전체 페이지 */

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #dff4f6;
    }


    /* 로고 */

    .logo {
      margin-bottom: 55px;

      color: #10202a;

      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
    }


    /* 제목 */

    .result-title {
      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;
      letter-spacing: -1.5px;
    }


    /* 선택한 기분 */

    .selected-mood {
      margin-top: 25px;

      font-size: 64px;
      line-height: 1;
    }


    /* 기분 설명 */

    .mood-text {
      margin-top: 20px;

      text-align: center;

      font-size: 17px;
      line-height: 1.5;

      color: #4b626b;
    }


    /* 장르 선택 */

    .genre-title {
      width: 100%;
      max-width: 420px;

      margin-top: 32px;
      margin-bottom: 12px;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 0.8px;

      color: #78909a;
    }


    .genre-row {
      width: 100%;
      max-width: 420px;

      display: flex;
      gap: 10px;
    }


    .genre-button {
      flex: 1;

      padding: 13px 10px;

      border: 1px solid
        rgba(16, 32, 42, 0.1);

      border-radius: 16px;

      background:
        rgba(255, 255, 255, 0.6);

      color: #526b74;

      font-size: 14px;
      font-weight: 500;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }


    .genre-button.active {
      background: #10202a;
      color: #ffffff;

      border-color: #10202a;
    }


    .genre-button:active {
      transform: scale(0.96);
    }


    /* 음악 카드 */

    .music-card {
      width: 100%;
      max-width: 420px;

      margin-top: 28px;

      padding: 24px;

      border-radius: 26px;

      background:
        rgba(255, 255, 255, 0.8);

      box-shadow:
        0 10px 30px
        rgba(16, 32, 42, 0.08);
    }


    /* TODAY'S PICK */

    .music-label {
      font-size: 13px;

      font-weight: 600;

      letter-spacing: 1px;

      color: #78909a;
    }


    /* 노래 제목 */

    .music-title {
      margin: 10px 0 5px;

      font-size: 22px;

      font-weight: 600;

      color: #10202a;
    }


    /* 아티스트 */

    .music-artist {
      margin: 0;

      font-size: 15px;

      color: #607781;
    }


    /* 버튼 영역 */

    .button-row {
      display: flex;

      gap: 10px;

      width: 100%;

      margin-top: 22px;
    }


    /* YouTube Music */

    .music-button {
      flex: 1;

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 52px;

      padding: 14px 10px;

      border-radius: 18px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 15px;

      font-weight: 500;

      letter-spacing: 0.3px;
    }


    /* 하트 */

    .heart-button {
      width: 58px;
      min-width: 58px;

      min-height: 52px;

      border: none;

      border-radius: 18px;

      background: #edf7f8;

      color: #10202a;

      font-size: 25px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }


    .heart-button:active {
      transform: scale(0.88);
    }


    /* 저장된 상태 */

    .heart-button.saved {
      background: #10202a;
      color: #ffffff;
    }


    /* 다른 노래 */

      width: 100%;

      padding: 13px 20px;

      border-radius: 16px;

      background:
        rgba(255, 255, 255, 0.55);

      color: #526b74;

      font-size: 14px;

      cursor: pointer;

      padding: 15px 20px;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      );


    /* =========================================
       랜덤 음악 가져오기
    ========================================= */

    function getRandomMusic(
      moodName,
      genreName
    ) {

      const moodData =
        musicData[moodName];


      if (!moodData) {

        return {
          title: "Ocean",
          artist: "SHARK 추천 음악"
        };

      }


      let list = [];


      /* K-POP */

      if (
        genreName === "KPOP"
      ) {

        list =
          moodData.KPOP || [];

      }


      /* POP */

      else if (
        genreName === "POP"
      ) {

        list =
          moodData.POP || [];

      }


      /* 전체 */

      else {

        list = [
          ...(moodData.KPOP || []),
          ...(moodData.POP || [])
        ];

      }


      if (
        list.length === 0
      ) {

        return {
          title: "Ocean",
          artist: "SHARK 추천 음악"
        };

      }


      /*
        같은 곡이 연속해서
        나오는 것을 최대한 방지
      */

      let availableList =
        list.filter(
          function(song) {

            if (!currentMusic) {
              return true;
            }

            return !(
              song.title ===
                currentMusic.title
              &&
              song.artist ===
                currentMusic.artist
            );

          }
        );


      if (
        availableList.length === 0
      ) {

        availableList = list;

      }


      const randomIndex =
        Math.floor(
          Math.random() *
          availableList.length
        );


      return availableList[
        randomIndex
      ];

    }


    /* =========================================
       YouTube Music 검색
    ========================================= */

    function getYouTubeMusicURL(
      music
    ) {

      const searchText =
        music.title +
        " " +
        music.artist;


      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(
          searchText
        )
      );

    }


    /* =========================================
       하트 상태 업데이트
    ========================================= */

    function updateHeart() {

      if (!currentMusic) {
        return;
      }


      const isSaved =
        savedSongs.some(
          function(song) {

            return (
              song.title ===
                currentMusic.title
              &&
              song.artist ===
                currentMusic.artist
            );

          }
        );


      if (isSaved) {

        heartButton.textContent =
          "❤️";

        heartButton.classList.add(
          "saved"
        );

      } else {

        heartButton.textContent =
          "🤍";

        heartButton.classList.remove(
          "saved"
        );

      }

    }


    /* =========================================
       음악 표시
    ========================================= */

    ) {

      currentMusic =
        music;


      musicTitle.textContent =
        music.title;


      musicArtist.textContent =
        music.artist;


      musicButton.href =
        getYouTubeMusicURL(
          music

      updateHeart();

      selectedMood.textContent =
        moodEmoji[mood] ||
        "😊";


      moodText.textContent =
        moodMessage[mood] ||
        "너의 기분에 어울리는 노래를 골라봤어.";


      showMusic(
        getRandomMusic(
          mood,
          currentGenre
        )
      );

    } else {

      showMusic(
        getRandomMusic(
          "행복",
          currentGenre
        )
      );

    }


    /* =========================================
       장르 버튼
    ========================================= */

    const genreButtons =
      document.querySelectorAll(
        ".genre-button"
      );


    genreButtons.forEach(
      function(button) {

        button.addEventListener(
          "click",
          function() {

            /*
              선택 표시
            */

            genreButtons.forEach(
              function(item) {

                item.classList.remove(
                  "active"
                );

              }
            );


            button.classList.add(
              "active"
            );


            /*
              장르 변경
            */

            currentGenre =
              button.dataset.genre;


            /*
              새로운 곡 추천
            */

            showMusic(
              getRandomMusic(
                mood || "행복",
                currentGenre
              )
            );

          }
        );

      }
    );


    /* =========================================
       다른 노래 추천
    ========================================= */

    randomButton.addEventListener(
      "click",
      function() {

        showMusic(
          getRandomMusic(
            mood || "행복",
            currentGenre
          )
        );

      }
    );


    /* =========================================
       ❤️ 저장 / 삭제
    ========================================= */

    heartButton.addEventListener(
      "click",
      function() {

        if (!currentMusic) {
          return;
        }


        const existingIndex =
          savedSongs.findIndex(
            function(song) {

              return (
                song.title ===
                  currentMusic.title
                &&
                song.artist ===
                  currentMusic.artist
              );

            }
          );


        /*
          이미 저장되어 있다면 삭제
        */

        if (
          existingIndex !== -1
        ) {

          savedSongs.splice(
            existingIndex,
            1
          );

        }


        /*
          저장되어 있지 않다면 추가
        */

        else {

          savedSongs.push({

            title:
              currentMusic.title,

            artist:
              currentMusic.artist,

            url:
              getYouTubeMusicURL(
                currentMusic
              )

          });

        }


        /*
          브라우저에 저장
        */

        localStorage.setItem(
          "sharkPlaylist",
          JSON.stringify(
            savedSongs
          )
        );


        /*
          하트 업데이트
        */

        updateHeart();

      }
    );


    /* =========================================
       MY MUSIC
    ========================================= */

    document
      .getElementById(
        "playlistButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./playlist.html";

        }
      );


    /* =========================================
       다시 고르기
    ========================================= */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        function() {

          window.location.href =
            "./mood.html";

        }
      );

  </script>

</body>
</html>
