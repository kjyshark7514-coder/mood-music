<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #06141d;
      color: #f4fbfd;
    }

    button {
      font-family: inherit;
    }

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(28px + env(safe-area-inset-top))
        20px
        calc(40px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(44, 145, 171, 0.22),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #071a24 0%,
          #06141d 48%,
          #041017 100%
        );
    }

    .page::before {
      content: "";

      position: absolute;

      width: 520px;
      height: 520px;

      top: 180px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(30, 166, 193, 0.10),
          transparent 68%
        );

      pointer-events: none;
    }

    .logo {
      position: relative;
      z-index: 1;

      margin-bottom: 52px;

      color: #ffffff;

      font-size: 18px;
      font-weight: 700;

      letter-spacing: 5px;
    }

    .logo::after {
      content: "";

      display: block;

      width: 22px;
      height: 2px;

      margin: 8px auto 0;

      border-radius: 2px;

      background: #55d5e8;
    }

    .eyebrow {
      position: relative;
      z-index: 1;

      margin-bottom: 12px;

      color: #65d5e5;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 2.2px;
    }

    .result-title {
      position: relative;
      z-index: 1;

      margin: 0;

      text-align: center;

      color: #ffffff;

      font-size:
        clamp(29px, 8vw, 42px);

      line-height: 1.25;

      font-weight: 650;

      letter-spacing: -1.8px;
    }

    .selected-mood-wrap {
      position: relative;
      z-index: 1;

      width: 86px;
      height: 86px;

      margin-top: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        rgba(77, 208, 225, 0.08);

      border:
        1px solid
        rgba(99, 221, 235, 0.25);

      box-shadow:
        0 0 35px
        rgba(45, 193, 214, 0.10);
    }

    .selected-mood {
      font-size: 43px;
      line-height: 1;
    }

    .mood-text {
      position: relative;
      z-index: 1;

      max-width: 330px;

      margin: 17px auto 0;

      text-align: center;

      color: #9db7bf;

      font-size: 14px;
      line-height: 1.6;
    }

    .genre-section {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 440px;

      margin-top: 34px;
    }

    .genre-title {
      margin-bottom: 11px;

      color: #7898a2;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.5px;
    }

    .genre-row {
      width: 100%;

      display: flex;

      padding: 4px;
      gap: 4px;

      border-radius: 17px;

      background:
        rgba(255, 255, 255, 0.055);

      border:
        1px solid
        rgba(255, 255, 255, 0.07);
    }

    .genre-button {
      flex: 1;

      padding: 12px 10px;

      border: none;
      border-radius: 13px;

      background: transparent;
      color: #7f9ca5;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }

    .genre-button.active {
      background: #eafcff;
      color: #09202a;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, 0.16);
    }

    .genre-button:active {
      transform: scale(0.96);
    }

    .music-list {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 440px;

      margin-top: 20px;

      display: flex;
      flex-direction: column;

      gap: 11px;
    }

    .music-card {
      position: relative;

      width: 100%;

      padding: 18px;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.105),
          rgba(255, 255, 255, 0.045)
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.18);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      overflow: hidden;
    }

    .music-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 3px;
      height: 100%;

      background:
        linear-gradient(
          180deg,
          #58d9ea,
          rgba(88, 217, 234, 0.05)
        );
    }

    .music-top {
      display: flex;
      align-items: flex-start;

      gap: 13px;
    }

    .music-number {
      width: 30px;
      min-width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background:
        rgba(91, 215, 232, 0.09);

      color: #6bd8e7;

      font-size: 11px;
      font-weight: 700;
    }

    .music-info {
      flex: 1;
      min-width: 0;
    }

    .music-title {
      margin: 1px 0 4px;

      color: #f5fcfd;

      font-size: 17px;
      font-weight: 600;

      line-height: 1.35;
    }

    .music-artist {
      margin: 0;

      color: #7f9ca5;

      font-size: 13px;
      line-height: 1.4;
    }

    .button-row {
      display: flex;

      gap: 8px;

      width: 100%;

      margin-top: 15px;
    }

    .music-button {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 43px;

      padding: 10px;

      border-radius: 13px;

      background: #ecfbfd;

      color: #09202a;

      text-align: center;
      text-decoration: none;

      font-size: 13px;
      font-weight: 650;
    }

    .heart-button {
      width: 48px;
      min-width: 48px;
      min-height: 43px;

      border:
        1px solid
        rgba(255, 255, 255, 0.08);

      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.055);

      color: #a5c0c7;

      font-size: 20px;

      cursor: pointer;
    }

    .heart-button.saved {
      background:
        rgba(255, 82, 105, 0.13);

      color: #ff7185;
    }

    .random-button,
    .playlist-button {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 440px;

      cursor: pointer;
    }

    .random-button {
      margin-top: 17px;

      padding: 14px 20px;

      border:
        1px solid
        rgba(255, 255, 255, 0.09);

      border-radius: 15px;

      background:
        rgba(255, 255, 255, 0.045);

      color: #9bb7bf;

      font-size: 13px;
    }

    .playlist-button {
      margin-top: 12px;

      padding: 15px 20px;

      border:
        1px solid
        rgba(92, 214, 231, 0.18);

      border-radius: 16px;

      background:
        rgba(70, 197, 216, 0.075);

      color: #bdebf0;

      font-size: 13px;
      font-weight: 600;
    }

    .back-button {
      position: relative;
      z-index: 1;

      margin-top: 15px;

      padding: 11px 20px;

      border: none;

      background: transparent;

      color: #66838c;

      font-size: 13px;

      cursor: pointer;
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .logo {
        margin-bottom: 43px;
      }

      .selected-mood-wrap {
        width: 78px;
        height: 78px;
      }

      .selected-mood {
        font-size: 38px;
      }

      .music-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo">
      SHARK
    </div>

    <div class="eyebrow">
      YOUR MOOD · YOUR MUSIC
    </div>

    <h1 class="result-title">
      오늘은 이런 노래 어때?
    </h1>

    <div class="selected-mood-wrap">
      <div
        class="selected-mood"
        id="selectedMood"
      >
        😊
      </div>
    </div>

    <p
      class="mood-text"
      id="moodText"
    ></p>

    <section class="genre-section">

      <div class="genre-title">
        CHOOSE YOUR SOUND
      </div>

      <div class="genre-row">

        <button
          class="genre-button active"
          type="button"
          data-genre="ALL"
        >
          전체
        </button>

        <button
          class="genre-button"
          type="button"
          data-genre="KPOP"
        >
          K-POP
        </button>

        <button
          class="genre-button"
          type="button"
          data-genre="POP"
        >
          POP
        </button>

      </div>

    </section>

    <div
      class="music-list"
      id="musicList"
    ></div>

    <button
      class="random-button"
      id="randomButton"
      type="button"
    >
      다른 노래 추천
    </button>

    <button
      class="playlist-button"
      id="playlistButton"
      type="button"
    >
      MY MUSIC
    </button>

    <button
      class="back-button"
      id="backButton"
      type="button"
    >
      다시 고르기
    </button>

  </main>

  <script src="./music-data.js"></script>

  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedMood =
      params.get("mood");

    const currentMood =
      (
        requestedMood &&
        typeof musicData !== "undefined" &&
        musicData[requestedMood]
      )
        ? requestedMood
        : "행복";

    let currentGenre =
      "ALL";

    let currentMusicList =
      [];

    const selectedMood =
      document.getElementById(
        "selectedMood"
      );

    const moodText =
      document.getElementById(
        "moodText"
      );

    const musicList =
      document.getElementById(
        "musicList"
      );

    const randomButton =
      document.getElementById(
        "randomButton"
      );

    const playlistButton =
      document.getElementById(
        "playlistButton"
      );

    const backButton =
      document.getElementById(
        "backButton"
      );

    const moodEmoji = {
      "행복": "😊",
      "사랑": "💗",
      "슬픔": "😢",
      "화남": "😡",
      "피곤": "😴",
      "위로": "🥺",
      "신남": "🤩",
      "SHARK": "🦈"
    };

    const moodMessage = {
      "행복":
        "기분을 더 밝게 만들어줄 노래를 골라봤어.",

      "사랑":
        "설레는 마음에 어울리는 노래를 골라봤어.",

      "슬픔":
        "조용히 감정에 머물 수 있는 노래를 골라봤어.",

      "화남":
        "답답한 기분을 시원하게 날려줄 노래를 골라봤어.",

      "피곤":
        "힘을 빼고 편하게 들을 수 있는 노래를 골라봤어.",

      "위로":
        "오늘 너에게 따뜻하게 닿을 노래를 골라봤어.",

      "신남":
        "지금 에너지를 더 끌어올릴 노래를 골라봤어.",

      "SHARK":
        "몽환적인 바다와 새벽 드라이브에 어울리는 노래를 골라봤어."
    };

    let savedSongs = [];

    try {
      savedSongs =
        JSON.parse(
          localStorage.getItem(
            "sharkPlaylist"
          ) || "[]"
        );

      if (!Array.isArray(savedSongs)) {
        savedSongs = [];
      }
    }
    catch (error) {
      savedSongs = [];
    }

    const HISTORY_KEY =
      "sharkRecommendationHistoryV4";

    const LAST_KEY =
      "sharkLastRecommendationsV4";

    function loadObject(
      key
    ) {
      try {
        const value =
          JSON.parse(
            sessionStorage.getItem(
              key
            ) || "{}"
          );

        if (
          value &&
          typeof value === "object"
        ) {
          return value;
        }

        return {};
      }
      catch (error) {
        return {};
      }
    }

    function saveObject(
      key,
      value
    ) {
      sessionStorage.setItem(
        key,
        JSON.stringify(
          value
        )
      );
    }

    function songKey(
      music
    ) {
      return (
        music.title
          .trim()
          .toLowerCase() +
        "|||" +
        music.artist
          .trim()
          .toLowerCase()
      );
    }

    function uniqueSongs(
      list
    ) {
      const seen =
        new Set();

      return list.filter(
        function(music) {
          const key =
            songKey(
              music
            );

          if (
            seen.has(
              key
            )
          ) {
            return false;
          }

          seen.add(
            key
          );

          return true;
        }
      );
    }

    function shuffleArray(
      array
    ) {
      const result =
        [...array];

      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {
        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        const temp =
          result[i];

        result[i] =
          result[j];

        result[j] =
          temp;
      }

      return result;
    }

    function getGenrePool(
      moodName,
      genreName
    ) {
      const moodData =
        musicData[moodName];

      if (!moodData) {
        return [];
      }

      if (
        genreName === "KPOP"
      ) {
        return uniqueSongs(
          moodData.KPOP || []
        );
      }

      if (
        genreName === "POP"
      ) {
        return uniqueSongs(
          moodData.POP || []
        );
      }

      return uniqueSongs([
        ...(moodData.KPOP || []),
        ...(moodData.POP || [])
      ]);
    }

    function getFiveMusic(
      moodName,
      genreName
    ) {
      const pool =
        getGenrePool(
          moodName,
          genreName
        );

      if (
        pool.length === 0
      ) {
        return [];
      }

      const history =
        loadObject(
          HISTORY_KEY
        );

      const lastHistory =
        loadObject(
          LAST_KEY
        );

      const historyId =
        moodName +
        "_" +
        genreName;

      const seenSongs =
        new Set(
          history[historyId] ||
          []
        );

      let unseenSongs =
        pool.filter(
          function(music) {
            return (
              !seenSongs.has(
                songKey(
                  music
                )
              )
            );
          }
        );

      /*
        남은 곡이 5곡보다 적으면
        한 바퀴를 거의 다 본 상태.

        이때 새 사이클을 시작하지만
        바로 직전 추천곡은 제외한다.
      */

      if (
        unseenSongs.length < 5
      ) {
        const lastSongs =
          new Set(
            lastHistory[
              historyId
            ] || []
          );

        const freshPool =
          pool.filter(
            function(music) {
              return (
                !lastSongs.has(
                  songKey(
                    music
                  )
                )
              );
            }
          );

        seenSongs.clear();

        unseenSongs =
          freshPool.length >= 5
            ? freshPool
            : [...pool];
      }

      const selected =
        shuffleArray(
          unseenSongs
        ).slice(
          0,
          5
        );

      selected.forEach(
        function(music) {
          seenSongs.add(
            songKey(
              music
            )
          );
        }
      );

      history[
        historyId
      ] =
        [...seenSongs];

      lastHistory[
        historyId
      ] =
        selected.map(
          songKey
        );

      saveObject(
        HISTORY_KEY,
        history
      );

      saveObject(
        LAST_KEY,
        lastHistory
      );

      return selected;
    }

    function getMusicURL(
      music
    ) {
      const searchText =
        music.title +
        " " +
        music.artist;

      return (
        "https://music.youtube.com/search?q=" +
        encodeURIComponent(
          searchText
        )
      );
    }

    function isSaved(
      music
    ) {
      return savedSongs.some(
        function(song) {
          return (
            song.title ===
              music.title &&
            song.artist ===
              music.artist
          );
        }
      );
    }

    function renderMusicList(
      musicArray
    ) {
      currentMusicList =
        musicArray;

      musicList.innerHTML =
        "";

      musicArray.forEach(
        function(
          music,
          index
        ) {
          const card =
            document.createElement(
              "article"
            );

          card.className =
            "music-card";

          const top =
            document.createElement(
              "div"
            );

          top.className =
            "music-top";

          const number =
            document.createElement(
              "div"
            );

          number.className =
            "music-number";

          number.textContent =
            String(
              index + 1
            ).padStart(
              2,
              "0"
            );

          const info =
            document.createElement(
              "div"
            );

          info.className =
            "music-info";

          const title =
            document.createElement(
              "h2"
            );

          title.className =
            "music-title";

          title.textContent =
            music.title;

          const artist =
            document.createElement(
              "p"
            );

          artist.className =
            "music-artist";

          artist.textContent =
            music.artist;

          info.appendChild(
            title
          );

          info.appendChild(
            artist
          );

          top.appendChild(
            number
          );

          top.appendChild(
            info
          );

          const buttonRow =
            document.createElement(
              "div"
            );

          buttonRow.className =
            "button-row";

          const musicButton =
            document.createElement(
              "a"
            );

          musicButton.className =
            "music-button";

          musicButton.href =
            getMusicURL(
              music
            );

          musicButton.target =
            "_blank";

          musicButton.rel =
            "noopener noreferrer";

          musicButton.textContent =
            "YouTube Music에서 듣기";

          const heartButton =
            document.createElement(
              "button"
            );

          heartButton.className =
            "heart-button";

          heartButton.type =
            "button";

          if (
            isSaved(
              music
            )
          ) {
            heartButton.textContent =
              "♥";

            heartButton.classList.add(
              "saved"
            );
          }
          else {
            heartButton.textContent =
              "♡";
          }

          heartButton.addEventListener(
            "click",
            function() {
              const existingIndex =
                savedSongs.findIndex(
                  function(song) {
                    return (
                      song.title ===
                        music.title &&
                      song.artist ===
                        music.artist
                    );
                  }
                );

              if (
                existingIndex !== -1
              ) {
                savedSongs.splice(
                  existingIndex,
                  1
                );
              }
              else {
                savedSongs.push({
                  title:
                    music.title,

                  artist:
                    music.artist,

                  url:
                    getMusicURL(
                      music
                    )
                });
              }

              localStorage.setItem(
                "sharkPlaylist",
                JSON.stringify(
                  savedSongs
                )
              );

              renderMusicList(
                currentMusicList
              );
            }
          );

          buttonRow.appendChild(
            musicButton
          );

          buttonRow.appendChild(
            heartButton
          );

          card.appendChild(
            top
          );

          card.appendChild(
            buttonRow
          );

          musicList.appendChild(
            card
          );
        }
      );
    }

    function recommendMusic() {
      const musicArray =
        getFiveMusic(
          currentMood,
          currentGenre
        );

      renderMusicList(
        musicArray
      );
    }

    selectedMood.textContent =
      moodEmoji[currentMood] ||
      "😊";

    moodText.textContent =
      moodMessage[currentMood] ||
      "";

    recommendMusic();

    const genreButtons =
      document.querySelectorAll(
        ".genre-button"
      );

    genreButtons.forEach(
      function(button) {
        button.addEventListener(
          "click",
          function() {
            genreButtons.forEach(
              function(item) {
                item.classList.remove(
                  "active"
                );
              }
            );

            button.classList.add(
              "active"
            );

            currentGenre =
              button.dataset.genre;

            recommendMusic();
          }
        );
      }
    );

    randomButton.addEventListener(
      "click",
      function() {
        recommendMusic();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    );

    playlistButton.addEventListener(
      "click",
      function() {
        window.location.href =
          "./playlist.html";
      }
    );

    backButton.addEventListener(
      "click",
      function() {
        window.location.href =
          "./mood.html";
      }
    );
  </script>

</body>
</html>
