<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SHARK - Music</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #dff4f6;
      color: #10202a;
    }

    button {
      font-family: inherit;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        calc(45px + env(safe-area-inset-top))
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #dff4f6;
    }


    /* 로고 */

    .logo {
      margin-bottom: 45px;

      color: #10202a;

      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
    }


    /* 제목 */

    .result-title {
      margin: 0;

      text-align: center;

      color: #10202a;

      font-size:
        clamp(28px, 7vw, 40px);

      line-height: 1.3;

      font-weight: 600;

      letter-spacing: -1.5px;
    }


    /* 기분 */

    .selected-mood {
      margin-top: 24px;

      font-size: 60px;

      line-height: 1;
    }


    .mood-text {
      margin-top: 18px;

      text-align: center;

      font-size: 16px;

      line-height: 1.5;

      color: #4b626b;
    }


    /* 장르 */

    .genre-title {
      width: 100%;
      max-width: 420px;

      margin-top: 30px;
      margin-bottom: 12px;

      text-align: center;

      font-size: 15px;

      font-weight: 600;

      color: #607781;
    }


    .genre-buttons {
      width: 100%;
      max-width: 420px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }


    .genre-button {
      padding: 15px 10px;

      border: none;

      border-radius: 18px;

      background:
        rgba(
          255,
          255,
          255,
          0.72
        );

      color: #526b74;

      font-size: 16px;

      font-weight: 500;

      cursor: pointer;

      transition: 0.2s ease;
    }


    .genre-button.selected {
      background: #10202a;

      color: #ffffff;

      box-shadow:
        0 8px 20px
        rgba(
          16,
          32,
          42,
          0.12
        );
    }


    .genre-button:active {
      transform: scale(0.95);
    }


    /* 플레이리스트 헤더 */

    .playlist-header {
      width: 100%;
      max-width: 420px;

      margin-top: 35px;
    }


    .playlist-name {
      margin: 0;

      font-size: 21px;

      font-weight: 600;

      color: #10202a;
    }


    .playlist-description {
      margin: 6px 0 0;

      font-size: 14px;

      color: #71868e;
    }


    /* 다른 곡 */

    .shuffle-button {
      width: 100%;
      max-width: 420px;

      margin-top: 16px;

      padding: 14px;

      border: none;

      border-radius: 17px;

      background:
        rgba(
          255,
          255,
          255,
          0.72
        );

      color: #10202a;

      font-size: 15px;

      font-weight: 500;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }


    .shuffle-button:active {
      transform: scale(0.97);
    }


    /* 음악 목록 */

    .music-list {
      width: 100%;
      max-width: 420px;

      margin-top: 16px;

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    /* 음악 카드 */

    .music-card {
      position: relative;

      width: 100%;

      padding: 18px;

      padding-right: 62px;

      border-radius: 22px;

      background:
        rgba(
          255,
          255,
          255,
          0.82
        );

      box-shadow:
        0 8px 25px
        rgba(
          16,
          32,
          42,
          0.06
        );

      animation:
        cardAppear
        0.3s ease;
    }


    @keyframes cardAppear {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    .music-number {
      font-size: 11px;

      font-weight: 600;

      color: #91a4aa;

      letter-spacing: 1px;
    }


    .music-title {
      margin: 7px 0 4px;

      font-size: 18px;

      font-weight: 600;

      color: #10202a;
    }


    .music-artist {
      margin: 0;

      font-size: 14px;

      color: #607781;
    }


    /* 하트 */

    .heart-button {
      position: absolute;

      top: 18px;
      right: 16px;

      width: 38px;
      height: 38px;

      border: none;

      border-radius: 50%;

      background:
        rgba(
          223,
          244,
          246,
          0.8
        );

      color: #526b74;

      font-size: 18px;

      cursor: pointer;

      transition:
        transform 0.2s ease;
    }


    .heart-button.saved {
      background: #10202a;

      color: #ffffff;
    }


    .heart-button:active {
      transform: scale(0.85);
    }


    /* 듣기 */

    .music-button {
      display: block;

      width: 100%;

      margin-top: 14px;

      padding: 12px;

      border-radius: 15px;

      background: #10202a;

      color: #ffffff;

      text-align: center;

      text-decoration: none;

      font-size: 14px;

      font-weight: 500;
    }


    /* 내 플레이리스트 */

    .my-playlist {
      width: 100%;
      max-width: 420px;

      margin-top: 35px;

      padding: 22px;

      border-radius: 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.65
        );
    }


    .my-playlist-title {
      margin: 0;

      font-size: 19px;

      font-weight: 600;
    }


    .saved-count {
      margin-top: 5px;

      font-size: 13px;

      color: #78909a;
    }


    .saved-list {
      margin-top: 15px;
    }


    .saved-item {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 10px 0;

      border-bottom:
        1px solid
        rgba(
          16,
          32,
          42,
          0.07
        );
    }


    .saved-item:last-child {
      border-bottom: none;
    }


    .saved-info {
      min-width: 0;
    }


    .saved-title {
      font-size: 14px;

      font-weight: 600;
    }


    .saved-artist {
      margin-top: 3px;

      font-size: 12px;

      color: #78909a;
    }


    .remove-button {
      flex-shrink: 0;

      border: none;

      background: transparent;

      color: #78909a;

      font-size: 13px;

      cursor: pointer;
    }


    .empty-message {
      margin: 15px 0 0;

      font-size: 13px;

      line-height: 1.5;

      color: #78909a;
    }


    /* 다시 선택 */

    .back-button {
      margin-top: 25px;

      padding: 12px 20px;

      border: none;

      background: transparent;

      color: #526b74;

      font-size: 15px;

      cursor: pointer;
    }


    @media (max-width: 380px) {

      .page {
        padding-left: 18px;
        padding-right: 18px;
      }

      .selected-mood {
        font-size: 54px;
      }

      .music-title {
        font-size: 17px;
      }

    }

  </style>
</head>

        ["Like I Need U", "Keshi"],
        ["Limbo", "Keshi"],
        ["Get You", "Daniel Caesar"],
        ["Location Unknown", "HONNE"]

      ],


      "위로": [

        ["Fix You", "Coldplay"],
        ["Count on Me", "Bruno Mars"],
        ["Vienna", "Billy Joel"],
        ["You Say", "Lauren Daigle"],
        ["Breathe Me", "Sia"],
        ["Yellow", "Coldplay"],
        ["The Scientist", "Coldplay"],
        ["Photograph", "Ed Sheeran"],
        ["Castle on the Hill", "Ed Sheeran"],
        ["Beautiful", "Christina Aguilera"],
        ["Rise Up", "Andra Day"],
        ["Fight Song", "Rachel Platten"],
        ["Brave", "Sara Bareilles"],
        ["A Sky Full of Stars", "Coldplay"],
        ["Home", "Phillip Phillips"],
        ["Keep Your Head Up", "Andy Grammer"],
        ["Better Days", "OneRepublic"],
        ["I Lived", "OneRepublic"],
        ["Unwritten", "Natasha Bedingfield"],
        ["Hall of Fame", "The Script"]

      ],


      "신남": [

        ["Wake Me Up", "Avicii"],
        ["I Gotta Feeling", "The Black Eyed Peas"],
        ["Don't Start Now", "Dua Lipa"],
        ["On Top of the World", "Imagine Dragons"],
        ["Dance The Night", "Dua Lipa"],
        ["Uptown Funk", "Mark Ronson"],
        ["24K Magic", "Bruno Mars"],
        ["Treasure", "Bruno Mars"],
        ["Party Rock Anthem", "LMFAO"],
        ["Dynamite", "Taio Cruz"],
        ["Rather Be", "Clean Bandit"],
        ["Titanium", "David Guetta"],
        ["Levels", "Avicii"],
        ["The Nights", "Avicii"],
        ["Sugar", "Maroon 5"],
        ["Moves Like Jagger", "Maroon 5"],
        ["Cake by the Ocean", "DNCE"],
        ["Good Time", "Owl City"],
        ["Firework", "Katy Perry"],
        ["Teenage Dream", "Katy Perry"]

      ],


      /*
        🦈 OCEAN
      */

      "SHARK": [

        ["Ocean", "Martin Garrix"],
        ["Ocean Eyes", "Billie Eilish"],
        ["Waves", "Mr. Probz"],
        ["Riptide", "Vance Joy"],
        ["Sunset Lover", "Petit Biscuit"],
        ["Watermelon Sugar", "Harry Styles"],
        ["Ocean Drive", "Duke Dumont"],
        ["A Sky Full of Stars", "Coldplay"],
        ["Paradise", "Coldplay"],
        ["Sweet Disposition", "The Temper Trap"],
        ["Space Song", "Beach House"],
        ["Apocalypse", "Cigarettes After Sex"],
        ["Anchor", "Novo Amor"],
        ["Bloom", "The Paper Kites"],
        ["Coastline", "Hollow Coves"],
        ["Sunkissed", "khai dreams"],
        ["Waves", "Dean Lewis"],
        ["The Ocean", "Mike Perry"],
        ["Sea of Love", "Cat Power"],
        ["Island in the Sun", "Weezer"]

      ]

    };


    /*
      현재 장르
    */

    let currentGenre = "KPOP";


    /*
      현재 보여지는 곡
    */

    let currentSongs = [];


    /*
      저장된 곡
    */

    let savedSongs =
      JSON.parse(
        localStorage.getItem(
          "sharkPlaylist"
        )
      ) || [];


    /*
      화면 기본값
    */

    selectedMood.textContent =
      moodEmoji[mood] || "😊";


    moodText.textContent =
      moodMessage[mood] ||
      "너의 기분에 어울리는 노래를 골라봤어.";


    /*
      랜덤 5곡
    */

    function getRandomSongs(
      songs
    ) {

      const shuffled =
        [...songs];


      for (
        let i =
          shuffled.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          shuffled[i],
          shuffled[j]
        ] =
        [
          shuffled[j],
          shuffled[i]
        ];

      }


      return shuffled.slice(
        0,
        5
      );

    }


    /*
      랜덤 추천
    */

    function showMusic() {

      musicList.innerHTML = "";


      let candidates;


      if (
        currentGenre === "KPOP"
      ) {

        candidates =
          kpopMusic[mood] ||
          kpopMusic["행복"];


        playlistName.textContent =
          mood === "SHARK"
            ? "🦈 OCEAN — K-POP"
            : "SHARK PLAYLIST — K-POP";

      } else {

        candidates =
          popMusic[mood] ||
          popMusic["행복"];


        playlistName.textContent =
          mood === "SHARK"
            ? "🦈 OCEAN — POP"
            : "SHARK PLAYLIST — POP";

      }


      playlistDescription.textContent =
        mood === "SHARK"
          ? "바다와 물결을 떠올리게 하는 음악을 골라봤어."
          : "오늘의 기분에 맞춰 SHARK가 골라봤어.";


      /*
        이전 추천과 겹치지 않게
      */

      let available =
        candidates.filter(
          function (song) {

            return !currentSongs.some(
              function (oldSong) {

                return (
                  oldSong[0] === song[0] &&
                  oldSong[1] === song[1]
                );

              }
            );

          }
        );


      /*
        후보가 5곡보다 적으면
        다시 전체 후보 사용
      */

      if (
        available.length < 5
      ) {

        available =
          candidates;

      }


      currentSongs =
        getRandomSongs(
          available
        );


      /*
        카드 생성
      */

      currentSongs.forEach(
        function (music, index) {

          const title =
            music[0];

          const artist =
            music[1];


          const saved =
            savedSongs.some(
              function (song) {

                return (
                  song.title === title &&
                  song.artist === artist
                );

              }
            );


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "music-card";


          card.innerHTML = `

            <div class="music-number">
              ${String(index + 1).padStart(2, "0")}
            </div>


            <h2 class="music-title">
              ${title}
            </h2>


            <p class="music-artist">
              ${artist}
            </p>


            <button
              class="heart-button ${
                saved
                  ? "saved"
                  : ""
              }"
              type="button"
              data-title="${title}"
              data-artist="${artist}"
            >
              ${
                saved
                  ? "♥"
                  : "♡"
              }
            </button>


            <a
              href="#"
              class="music-button"
              data-title="${title}"
              data-artist="${artist}"
            >
              ▶ 노래 듣기
            </a>

          `;


          musicList.appendChild(
            card
          );

        }
      );

    }


    /*
      다른 곡 추천
    */

    shuffleButton.addEventListener(
      "click",
      function () {

        showMusic();

        window.scrollTo({
          top:
            musicList.offsetTop -
            20,

          behavior:
            "smooth"
        });

      }
    );


    /*
      하트 저장
    */

    musicList.addEventListener(
      "click",
      function (event) {

        const heart =
          event.target.closest(
            ".heart-button"
          );


        if (!heart) {
          return;
        }


        const title =
          heart.dataset.title;


        const artist =
          heart.dataset.artist;


        const index =
          savedSongs.findIndex(
            function (song) {

              return (
                song.title === title &&
                song.artist === artist
              );

            }
          );


        if (
          index === -1
        ) {

          savedSongs.push({

            title:
              title,

            artist:
              artist

          });

        } else {

          savedSongs.splice(
            index,
            1
          );

        }


        localStorage.setItem(
          "sharkPlaylist",
          JSON.stringify(
            savedSongs
          )
        );


        showMusic();

        showSavedPlaylist();

      }
    );


    /*
      YouTube Music
    */

    musicList.addEventListener(
      "click",
      function (event) {

        const button =
          event.target.closest(
            ".music-button"
          );


        if (!button) {
          return;
        }


        event.preventDefault();


        const title =
          button.dataset.title;


        const artist =
          button.dataset.artist;


        const query =
          title +
          " " +
          artist;


        const youtubeMusicURL =
          "https://music.youtube.com/search?q=" +
          encodeURIComponent(
            query
          );


        window.open(
          youtubeMusicURL,
          "_blank"
        );

      }
    );


    /*
      내 플레이리스트
    */

    function showSavedPlaylist() {

      savedList.innerHTML = "";


      savedCount.textContent =
        "저장된 곡 " +
        savedSongs.length +
        "개";


      if (
        savedSongs.length === 0
      ) {

        savedList.innerHTML = `

          <p class="empty-message">
            마음에 드는 곡의 ♡를 눌러봐.<br>
            여기에 나만의 SHARK PLAYLIST가 만들어져.
          </p>

        `;

        return;

      }


      savedSongs.forEach(
        function (song, index) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "saved-item";


          item.innerHTML = `

            <div class="saved-info">

              <div class="saved-title">
                ${index + 1}. ${song.title}
              </div>

              <div class="saved-artist">
                ${song.artist}
              </div>

            </div>


            <button
              class="remove-button"
              type="button"
              data-title="${song.title}"
              data-artist="${song.artist}"
            >
              삭제
            </button>

          `;


          savedList.appendChild(
            item
          );

        }
      );

    }


    /*
      저장곡 삭제
    */

    savedList.addEventListener(
      "click",
      function (event) {

        const button =
          event.target.closest(
            ".remove-button"
          );


        if (!button) {
          return;
        }


        const title =
          button.dataset.title;


        const artist =
          button.dataset.artist;


        savedSongs =
          savedSongs.filter(
            function (song) {

              return !(
                song.title === title &&
                song.artist === artist
              );

            }
          );


        localStorage.setItem(
          "sharkPlaylist",
          JSON.stringify(
            savedSongs
          )
        );


        showMusic();

        showSavedPlaylist();

      }
    );


    /*
      K-POP
    */

    kpopButton.addEventListener(
      "click",
      function () {

        currentGenre =
          "KPOP";


        currentSongs = [];


        kpopButton.classList.add(
          "selected"
        );

        popButton.classList.remove(
          "selected"
        );


        showMusic();

      }
    );


    /*
      POP
    */

    popButton.addEventListener(
      "click",
      function () {

        currentGenre =
          "POP";


        currentSongs = [];


        popButton.classList.add(
          "selected"
        );

        kpopButton.classList.remove(
          "selected"
        );


        showMusic();

      }
    );


    /*
      다시 고르기
    */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        function () {

          window.location.href =
            "./mood.html";

        }
      );


    /*
      최초 실행
    */

    showMusic();

    showSavedPlaylist();

  </script>

</body>
</html>
